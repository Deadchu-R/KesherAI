name: Release

# Builds installers for Windows, macOS and Linux when a version tag is pushed
# (git tag v0.1.0 && git push --tags), or when main is pushed to the `release`
# branch, and publishes them as a release (installed copies update from it).

on:
  push:
    tags: ["v*"]
    # Pushing to the `release` branch also builds the installers (a draft release for package.json's version).
    branches: [release]
  workflow_dispatch:

# Creating the draft release and uploading the installers needs write access to the repository's releases.
permissions:
  contents: write

jobs:
  # Lint, types, every test, the smoke test and the security checks (ci.yml): nothing is published if one fails.
  check:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    # ci.yml's docs job asks for these (it is skipped here): a called workflow may not ask for more than its caller gives.
    permissions:
      contents: read
      pages: write
      id-token: write

  # One draft release before the builds: the three systems used to create it at the same moment, which made two
  # releases with the same tag (0.6.48: Linux in one, Windows/Mac in the other) and the notes step failed. The builds
  # upload into this draft, and the notes job publishes it when all are in (installed copies never see half a release).
  prepare:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release view "v$VERSION" > /dev/null 2>&1 || gh release create "v$VERSION" --draft --title "KesherAI $VERSION" --notes "" --target "$GITHUB_SHA"

  build:
    needs: [check, prepare]
    strategy:
      # One system failing should not cancel the others' installers.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The Google sign-in client comes from the repository's secrets, so it is in the app but never in the source.
      - name: Add the Google and GitHub sign-in clients
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.KESHER_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.KESHER_GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.KESHER_GITHUB_CLIENT_ID }}
        run: node -e "const e=process.env;require('fs').writeFileSync('apps/desktop/dist/google-client.json', JSON.stringify({clientId:e.GOOGLE_CLIENT_ID||'',clientSecret:e.GOOGLE_CLIENT_SECRET||'',githubClientId:e.GITHUB_CLIENT_ID||''}))"
      # Electron and electron-builder's tools come from GitHub's release downloads, which answer
      # 504 at times: keep them between runs, and try the build again (what was downloaded stays).
      - id: dlcache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-dl-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: electron-dl-${{ runner.os }}-
      # Windows: fetch what electron-builder needs first, file by file, with curl trying again on
      # GitHub's 504s; when GitHub's downloads stay down, from the npmmirror.com copy instead.
      # Electron's zip is checked against the SHA-256 in the electron npm package (from npm, not
      # the mirror); electron-builder checks its own tools' SHA-512. Then they are served from this
      # machine, so electron-builder's own downloader (which never retries) finds them here.
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          EV=$(node -p "require('./apps/desktop/node_modules/electron/package.json').version")
          get() {
            mkdir -p "mirror/$1"
            curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o "mirror/$1/$2" "$3/$1/$2" && return 0
            echo "GitHub did not give $2; using npmmirror.com"
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 -o "mirror/$1/$2" "$4/${5:-$1}/$2"
          }
          # (npmmirror keeps Electron's files under the version without the "v")
          get "v$EV" "electron-v$EV-win32-x64.zip" https://github.com/electron/electron/releases/download https://npmmirror.com/mirrors/electron "$EV"
          get "v$EV" SHASUMS256.txt https://github.com/electron/electron/releases/download https://npmmirror.com/mirrors/electron "$EV"
          want=$(node -p "require('./apps/desktop/node_modules/electron/checksums.json')['electron-v$EV-win32-x64.zip']")
          got=$(sha256sum "mirror/v$EV/electron-v$EV-win32-x64.zip" | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "Electron's zip does not match its checksum"; exit 1; }
          for b in winCodeSign-2.6.0 nsis-3.0.4.1 nsis-resources-3.4.1; do
            get $b $b.7z https://github.com/electron-userland/electron-builder-binaries/releases/download https://npmmirror.com/mirrors/electron-builder-binaries
          done
      # Unsigned installers (macOS, Linux, and Windows until SignPath is set up).
      - if: runner.os != 'Windows' || vars.SIGNPATH_ORGANIZATION_ID == ''
        shell: bash
        run: |
          if [ -d mirror ]; then
            node scripts/serve-mirror.mjs mirror 8099 &
            for i in $(seq 1 30); do curl -fsI "http://127.0.0.1:8099/v$(node -p "require('./apps/desktop/node_modules/electron/package.json').version")/SHASUMS256.txt" >/dev/null && break; sleep 1; done
            export ELECTRON_MIRROR=http://127.0.0.1:8099/ ELECTRON_BUILDER_BINARIES_MIRROR=http://127.0.0.1:8099/
          fi
          for attempt in 1 2 3 4; do
            pnpm --filter @kesher/desktop exec electron-builder --publish always && exit 0
            echo "Build attempt $attempt failed; trying again in $((attempt * 60)) seconds."
            sleep $((attempt * 60))
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Saved even when the build failed: what did download is not fetched again on the next try.
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-dl-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Signed Windows build (docs/CODE_SIGNING.md): the app's files are signed by SignPath, then
      # packed into the installer, which is signed too, then published. Each signing waits for an approver.
      - if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        run: pnpm --filter @kesher/desktop exec electron-builder --win --dir --publish never
      - if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        id: app-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: apps/desktop/out/win-unpacked
      - if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: KesherAI
          signing-policy-slug: release-signing
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.app-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: apps/desktop/out/win-signed
      - if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        run: pnpm --filter @kesher/desktop exec electron-builder --win --prepackaged out/win-signed --publish never
      - if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        id: installer-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: apps/desktop/out/*Setup*.exe
      - if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: KesherAI
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: apps/desktop/out/installer-signed
      - if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        name: Publish the signed installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/signed-installer.mjs apps/desktop/out apps/desktop/out/installer-signed
          VERSION=$(node -p "require('./package.json').version")
          gh release view "v$VERSION" > /dev/null 2>&1 || gh release create "v$VERSION" --title "KesherAI $VERSION" --notes "" || true
          gh release upload "v$VERSION" apps/desktop/out/*Setup*.exe apps/desktop/out/latest.yml --clobber

  # The "what's new" list the app shows before updating: from the commits since the last release.
  notes:
    needs: [prepare, build]
    # Published even if one system's build failed (the others' installers are good), but never without the draft.
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --tags --force
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/release-notes.mjs "$VERSION" > notes.md
          cat notes.md
          # gh finds a draft by its tag too (the REST tag lookup does not); publishing it is the last step.
          ID=$(gh release view "v$VERSION" --json databaseId --jq .databaseId)
          gh api -X PATCH "repos/${{ github.repository }}/releases/$ID" -F body=@notes.md -f name="KesherAI $VERSION" -F draft=false > /dev/null
