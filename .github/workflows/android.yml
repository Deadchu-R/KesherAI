name: Android APK

# Builds the Android app (apps/android) into an installable APK.
# Every push to main publishes it to the "android-latest" release, so the
# newest APK is always at
#   https://github.com/Deadchu-R/KesherAI/releases/download/android-latest/KesherAI-android.apk
# A version tag (git tag v0.4.0 && git push --tags) also attaches it to that version's release.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 60 # the update button lists what changed since the installed build
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Generate the Android project
        working-directory: apps/android
        run: |
          npx cap add android
          # The computer serves KesherAI over plain HTTP on the home network or Tailscale.
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          # kesherai://connect?server=… links (the QR code in Settings → Phone) open the app and connect.
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          filt = ('<intent-filter><action android:name="android.intent.action.VIEW" />'
                  '<category android:name="android.intent.category.DEFAULT" />'
                  '<category android:name="android.intent.category.BROWSABLE" />'
                  '<data android:scheme="kesherai" /></intent-filter>')
          i = s.index("</intent-filter>", s.index("android.intent.action.MAIN")) + len("</intent-filter>")
          open(p, "w").write(s[:i] + filt + s[i:])
          PY
          grep -c 'android:scheme="kesherai"' android/app/src/main/AndroidManifest.xml
          # Every build gets a higher version number, so the app's update button can tell it is newer.
          VERSION=$(node -p "require('../../package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION (${{ github.run_number }})\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          # The app knows which commit it was built from, to list what changed in a newer build.
          node scripts/vendor.mjs
          echo "{\"commit\": \"$(git rev-parse HEAD)\"}" > www/build.json
          npx cap sync android
      - name: Sign every build with the project's fixed key (apps/android/signing/README.md)
        working-directory: apps/android/android
        run: |
          # Point the debug build at the committed key explicitly; Android Studio's default key location
          # differs between machines, and a different key makes updates fail with "package conflicts".
          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  kesher {
                      storeFile file("../../signing/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.kesher }
              }
          }
          GRADLE
      - name: Build the APK
        working-directory: apps/android/android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp apps/android/android/app/build/outputs/apk/debug/app-debug.apk KesherAI-android.apk
      - name: Check the APK is signed with the project's key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs KesherAI-android.apk | tee certs.txt
          grep -qi "SHA-256 digest: d2415a1e4f3ebc53b70e065edf2393c2e2134331f1da229815a3a1f4aa3648d3" certs.txt \
            || { echo "::error::The APK is not signed with apps/android/signing/debug.keystore, so it would not update the installed app."; exit 1; }
      - name: Describe this build for the app's update button
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node -e '
            const { execSync } = require("node:child_process");
            const log = execSync("git log -50 --format=%H%x09%s", { encoding: "utf8" }).trim().split("\n");
            const changes = log.map((l) => { const [sha, ...rest] = l.split("\t"); return { sha, subject: rest.join("\t") }; });
            require("node:fs").writeFileSync("android-version.json", JSON.stringify({
              versionCode: Number(process.argv[1]), versionName: `${process.argv[2]} (${process.argv[1]})`,
              apkUrl: `https://github.com/${process.argv[3]}/releases/download/android-latest/KesherAI-android.apk`, changes }));
          ' "${{ github.run_number }}" "$VERSION" "${{ github.repository }}"
          cat android-version.json
      - uses: actions/upload-artifact@v4
        with:
          name: KesherAI-android
          path: KesherAI-android.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" KesherAI-android.apk --title "$GITHUB_REF_NAME" --generate-notes || gh release upload "$GITHUB_REF_NAME" KesherAI-android.apk --clobber
      - if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="The newest Android app, rebuilt on every change. Open this page on your phone, tap KesherAI-android.apk, and allow installing from this source. Then paste the link from KesherAI → Settings → Phone."
          gh release upload android-latest KesherAI-android.apk android-version.json --clobber \
            || gh release create android-latest KesherAI-android.apk android-version.json --prerelease --title "Android app (latest)" --notes "$notes"
