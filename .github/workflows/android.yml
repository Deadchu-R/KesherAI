name: Android APK

# Builds the Android app (apps/android) into an installable APK.
# Every push to main publishes it to the "android-latest" release, so the
# newest APK is always at
#   https://github.com/Deadchu-R/KesherAI/releases/download/android-latest/KesherAI-android.apk
# A version tag (git tag v0.4.0 && git push --tags) also attaches it to that version's release.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/android/**"
      # The version number changes with every computer release: that alone is no new phone app.
      - "!apps/android/package.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 60 # the update button lists what changed since the installed build
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # (Before pnpm install: it copies the plugin folders, files included.)
      # Images on the phone: stable-diffusion.cpp (MIT) built for Android arm64, shipped as a native file
      # (lib…so so Android unpacks it where it may run). Cached per engine version.
      - name: Image engine for the phone (cache)
        id: sdcache
        uses: actions/cache@v4
        with:
          path: apps/android/plugins/image/android/src/main/jniLibs/arm64-v8a/libsdcli.so
          key: sdcpp-android-arm64-5f8c19f9
      - name: Build the image engine for the phone
        if: steps.sdcache.outputs.cache-hit != 'true'
        run: |
          # The same engine version the desktop build was checked with.
          git init -q /tmp/sd && git -C /tmp/sd remote add origin https://github.com/leejet/stable-diffusion.cpp
          git -C /tmp/sd fetch -q --depth 1 origin 5f8c19f98ddb84e301bb8725b5260ec79e768e22 && git -C /tmp/sd checkout -q FETCH_HEAD
          git -C /tmp/sd submodule update --init --depth 1 ggml
          cmake -S /tmp/sd -B /tmp/sd/build-android -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DSD_WEBP=OFF -DSD_WEBM=OFF -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF
          cmake --build /tmp/sd/build-android --target sd-cli -j4
          mkdir -p apps/android/plugins/image/android/src/main/jniLibs/arm64-v8a
          "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip -o apps/android/plugins/image/android/src/main/jniLibs/arm64-v8a/libsdcli.so /tmp/sd/build-android/bin/sd-cli
          ls -la apps/android/plugins/image/android/src/main/jniLibs/arm64-v8a
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Generate the Android project
        working-directory: apps/android
        env:
          GID: ${{ secrets.KESHER_GOOGLE_CLIENT_ID }}
          GSECRET: ${{ secrets.KESHER_GOOGLE_CLIENT_SECRET }}
        run: |
          npx cap add android
          # The computer serves KesherAI over plain HTTP on the home network or Tailscale.
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          # kesherai://connect?server=… links (the QR code in Settings → Phone) open the app and connect.
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          filt = ('<intent-filter><action android:name="android.intent.action.VIEW" />'
                  '<category android:name="android.intent.category.DEFAULT" />'
                  '<category android:name="android.intent.category.BROWSABLE" />'
                  '<data android:scheme="kesherai" /></intent-filter>')
          i = s.index("</intent-filter>", s.index("android.intent.action.MAIN")) + len("</intent-filter>")
          open(p, "w").write(s[:i] + filt + s[i:])
          PY
          grep -c 'android:scheme="kesherai"' android/app/src/main/AndroidManifest.xml
          # Every build gets a higher version number, so the app's update button can tell it is newer.
          VERSION=$(node -p "require('../../package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION (${{ github.run_number }})\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          # The app knows which commit it was built from, to list what changed in a newer build.
          node scripts/vendor.mjs
          echo "{\"commit\": \"$(git rev-parse HEAD)\", \"date\": $(git log -1 --format=%ct)}" > www/build.json
          # "Sign in with Google" finds the user's computers; the same Desktop OAuth client as the desktop app.
          node -e 'require("fs").writeFileSync("www/google-client.json", JSON.stringify({ clientId: process.env.GID || "", clientSecret: process.env.GSECRET || "" }))'
          npx cap sync android
      - name: Sign every build with the project's fixed key (apps/android/signing/README.md)
        working-directory: apps/android/android
        run: |
          # Point the debug build at the committed key explicitly; Android Studio's default key location
          # differs between machines, and a different key makes updates fail with "package conflicts".
          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  kesher {
                      storeFile file("../../signing/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.kesher }
              }
              // The image engine runs as a program from the app's native folder, so it must be unpacked there.
              packaging { jniLibs { useLegacyPackaging true } }
          }
          // UnifiedPush's encryption library (Tink) brings protobuf-javalite; the phone's model engines bring the
          // full protobuf-java, which holds the same classes. Keep the full one (two copies fail as duplicate classes).
          configurations.configureEach {
              exclude group: "com.google.protobuf", module: "protobuf-javalite"
          }
          GRADLE
      - name: Build the APK
        working-directory: apps/android/android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp apps/android/android/app/build/outputs/apk/debug/app-debug.apk KesherAI-android.apk
      - name: Check the APK is signed with the project's key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs KesherAI-android.apk | tee certs.txt
          grep -qi "SHA-256 digest: d2415a1e4f3ebc53b70e065edf2393c2e2134331f1da229815a3a1f4aa3648d3" certs.txt \
            || { echo "::error::The APK is not signed with apps/android/signing/debug.keystore, so it would not update the installed app."; exit 1; }
      - name: Describe this build for the app's update button
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node apps/android/scripts/version-info.mjs "${{ github.run_number }}" "$VERSION" "${{ github.repository }}" android-version.json
          cat android-version.json
      - uses: actions/upload-artifact@v4
        with:
          name: KesherAI-android
          path: KesherAI-android.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" KesherAI-android.apk --title "$GITHUB_REF_NAME" --generate-notes || gh release upload "$GITHUB_REF_NAME" KesherAI-android.apk --clobber
      - if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="The newest Android app, rebuilt on every change. Open this page on your phone, tap KesherAI-android.apk, and allow installing from this source. Then paste the link from KesherAI → Settings → Phone."
          gh release upload android-latest KesherAI-android.apk android-version.json --clobber \
            || gh release create android-latest KesherAI-android.apk android-version.json --prerelease --title "Android app (latest)" --notes "$notes"
