name: API docs

# Roee's KesherAI landing page with the API reference (typedoc) under /api/, rebuilt after every release (from main: GitHub Pages deploys only from the
# default branch unless told otherwise). GitHub Pages must be set once to "GitHub Actions" (Settings → Pages → Source).
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Only after a release that succeeded (or when run by hand).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # typedoc reads each package through the others' built types.
      - run: pnpm -w build:packages
      - run: pnpm docs:api
      # Never publish a personal path or address: stop if the site names one.
      - run: "! grep -rIlP 'C:\\\\Users\\\\|/home/(?!runner/)[a-z]+/|@gmail\\.com' docs/api"
      # roeetal.com/KesherAI is Roee's landing page (in Deadchu-R.github.io/KesherAI); this project site takes over that
      # address, so the site is the landing page itself with the API reference under /KesherAI/api/.
      - uses: actions/checkout@v4
        with:
          repository: Deadchu-R/Deadchu-R.github.io
          path: landing
          sparse-checkout: KesherAI
      - run: |
          mkdir -p _site
          cp -r landing/KesherAI/. _site/
          cp -r docs/api _site/api
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
