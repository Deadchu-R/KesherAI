name: API docs

# The API reference (typedoc) as a website, rebuilt on every release.
# GitHub Pages must be set once to "GitHub Actions" (Settings → Pages → Source).
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm docs:api
      # Never publish a personal path or address: stop if the site names one.
      - run: "! grep -rIlP 'C:\\\\Users\\\\|/home/(?!runner/)[a-z]+/|@gmail\\.com' docs/api"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
