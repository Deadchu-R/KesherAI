name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release runs these checks first and publishes only when they pass.
  workflow_call:

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @kesher/web build
      # The desktop app runs the core in Electron's Node, which cannot require() ES modules:
      # loading it with that switched off catches a dependency that would crash the app on start.
      - run: pnpm -w build:packages && node --no-experimental-require-module -e "import('@kesher/core').then(() => console.log('core loads without require(esm)'))"
        working-directory: apps/desktop
      # The real server, started empty: it answers, serves the interface, and refuses foreign websites.
      - run: node scripts/smoke.mjs

  # Windows: tests and the smoke test where Windows-only things live (cmd quoting, paths with spaces, .bat jobs).
  # Blocking: a release waits for it (green on Windows since 0.5.9x).
  windows:
    name: Windows tests and smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm build:packages && pnpm --filter @kesher/web build
      - run: node --conditions=source --import tsx --test --test-force-exit --test-timeout=120000 packages/core/src/windows-commands.test.ts packages/core/src/jobs.test.ts
      - run: node scripts/smoke.mjs
      - run: pnpm test

  # Security on every version: known-vulnerable dependencies and secrets that slipped into the code.
  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # High and critical advisories in what ships in the app block the release (docs/SECURITY_REVIEW.md lists the known ones).
      - run: pnpm audit --prod --audit-level high
      # Reported, not blocking, until a first full scan of the history has been looked at.
      - uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes the API reference to GitHub Pages. Off until the repository
  # owner enables Pages (Settings → Pages → Source: GitHub Actions) and adds
  # a repository variable PAGES_ENABLED=true (Settings → Secrets and variables → Actions → Variables).
  docs:
    name: Publish API docs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.PAGES_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm build:packages && pnpm docs:api
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api
      - id: deploy
        uses: actions/deploy-pages@v4
