name: CodeQL

# GitHub's code scanner looks for security bugs (injection, path traversal, unsafe
# regular expressions…) in the TypeScript code: on every push to main and weekly.
# Findings appear in the repository's Security tab.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
