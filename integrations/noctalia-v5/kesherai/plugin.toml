id = "kesherai/kesherai"
name = "KesherAI"
version = "0.4.0"
plugin_api = 36
author = "kesherai"
license = "MIT"
icon = "sparkles"
description = "Chat with KesherAI, your local AI, from a side panel; the bar shows when it is working."
tags = ["bar", "panel", "service", "ai"]
dependencies = ["xdg-utils"]

[[setting]]
key = "url"
type = "string"
label_key = "settings.url.label"
description_key = "settings.url.description"
default = "http://127.0.0.1:7420"

[[setting]]
key = "token"
type = "string"
label_key = "settings.token.label"
description_key = "settings.token.description"
default = ""
advanced = true

[[setting]]
key = "open_as"
type = "select"
label_key = "settings.open_as.label"
description_key = "settings.open_as.description"
options = [
  { value = "window", label_key = "settings.open_as.window" },
  { value = "panel", label_key = "settings.open_as.panel" },
]
default = "window"

[[service]]
id = "status"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 420
height = "fill"
placement = "floating"
position = "center_right"

# The chat as a floating window on the right: the same script as the panel; its width follows the ↔ slider.
[[layer]]
id = "window"
entry = "panel.luau"
layer = "top"
anchors = ["top", "bottom", "right"]
width = 420
margins = { top = 8, right = 8, bottom = 8 }
keyboard = "on_demand"
output = "focused"
