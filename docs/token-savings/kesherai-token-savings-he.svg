<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Heebo, Inter, Arial, sans-serif" role="img" aria-label="KesherAI — חיסכון בטוקנים"><title>KesherAI — חיסכון בטוקנים</title><rect width="960" height="540" rx="24" fill="#f4f1ea"/><text x="900" y="70" text-anchor="start" direction="rtl" font-size="34" font-weight="800" fill="#14171c">KesherAI — חיסכון בטוקנים</text><text x="900" y="106" text-anchor="start" direction="rtl" font-size="20" fill="#5d6470">עלות אפקטיבית (מיליוני טוקנים, יחידות קלט מקורבות)</text><text x="900" y="158" text-anchor="start" direction="rtl" font-size="20" fill="#2a2f37">בלי קאש</text><rect x="260" y="170" width="640" height="44" rx="8" fill="#b9b2a2"/><text x="248" y="200" text-anchor="end" font-size="22" font-weight="700" fill="#14171c">250M</text><text x="900" y="258" text-anchor="start" direction="rtl" font-size="20" fill="#2a2f37">עם קאש</text><rect x="831" y="270" width="69" height="44" rx="8" fill="#e46f22"/><text x="819" y="300" text-anchor="end" font-size="22" font-weight="700" fill="#14171c">27M</text><text x="60" y="300" text-anchor="end" direction="rtl" font-size="44" font-weight="800" fill="#e46f22">89% פחות</text><line x1="60" y1="350" x2="900" y2="350" stroke="#cfc8b8"/><text x="900" y="400" text-anchor="start" direction="rtl" font-size="24" font-weight="700" fill="#14171c">36 מחקרים שרצו מחוץ ל־Claude</text><text x="900" y="436" text-anchor="start" direction="rtl" font-size="22" fill="#2f6fd6">~4.5M טוקנים שלא הוצאו (הערכה)</text><text x="900" y="500" text-anchor="start" direction="rtl" font-size="15" fill="#5d6470">מדידה: 530 בקשות, נוב׳ 2026. משקלות: קריאת קאש ×0.1, כתיבה ×2, פלט ×5.</text></svg>