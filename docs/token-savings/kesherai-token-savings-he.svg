<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Heebo, Inter, Arial, sans-serif" role="img" aria-label="KesherAI token savings"><rect width="1000" height="620" rx="24" fill="#f4f1ea"/><text x="940" y="66" text-anchor="start" font-size="34" font-weight="800" fill="#14171c" direction="rtl">KesherAI — כמה עם וכמה בלי</text><text x="940" y="100" text-anchor="start" font-size="19" font-weight="400" fill="#5d6470" direction="rtl">מיליוני טוקנים (יחידות קלט מקורבות). אפור = בלי, כתום = עם</text><text x="940" y="150" text-anchor="start" font-size="22" font-weight="700" fill="#14171c" direction="rtl">קאש של ההקשר (נמדד)</text><rect x="390" y="164" width="550" height="30" rx="6" fill="#b9b2a2"/><text x="380" y="186" text-anchor="end" font-size="20" font-weight="700" fill="#14171c">250.2M</text><rect x="881" y="208" width="59" height="30" rx="6" fill="#e46f22"/><text x="871" y="230" text-anchor="end" font-size="20" font-weight="700" fill="#14171c">27M</text><text x="940" y="286" text-anchor="start" font-size="22" font-weight="700" fill="#14171c" direction="rtl">מחקר שעבר לאנטיגרוויטי ול־Gemini החינמי (הערכה)</text><rect x="930" y="300" width="10" height="30" rx="6" fill="#b9b2a2"/><text x="920" y="322" text-anchor="end" font-size="20" font-weight="700" fill="#14171c">4.5M</text><rect x="936" y="344" width="4" height="30" rx="6" fill="#e46f22"/><text x="926" y="366" text-anchor="end" font-size="20" font-weight="700" fill="#14171c">0.2M</text><text x="940" y="422" text-anchor="start" font-size="22" font-weight="700" fill="#14171c" direction="rtl">הכול ביחד</text><rect x="380" y="436" width="560" height="30" rx="6" fill="#b9b2a2"/><text x="370" y="458" text-anchor="end" font-size="20" font-weight="700" fill="#14171c">254.7M</text><rect x="880" y="480" width="60" height="30" rx="6" fill="#e46f22"/><text x="870" y="502" text-anchor="end" font-size="20" font-weight="700" fill="#14171c">27.2M</text><text x="60" y="548" text-anchor="end" direction="rtl" font-size="40" font-weight="800" fill="#e46f22">≈89% פחות בסך הכול</text><text x="940" y="590" text-anchor="start" font-size="15" font-weight="400" fill="#5d6470" direction="rtl">קאש: נמדד ב־530 בקשות (קריאה ×0.1, כתיבה ×2, פלט ×5). מחקר: 36 דוחות × כ־125K טוקנים שנמדדו לסוכן עוזר. נוב׳ 2026.</text></svg>