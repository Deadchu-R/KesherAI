<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Heebo, Inter, Arial, sans-serif" role="img" aria-label="KesherAI — token savings"><title>KesherAI — token savings</title><rect width="960" height="540" rx="24" fill="#f4f1ea"/><text x="60" y="70" text-anchor="start" font-size="34" font-weight="800" fill="#14171c">KesherAI — token savings</text><text x="60" y="106" text-anchor="start" font-size="20" fill="#5d6470">Effective cost (millions of tokens, approx. input units)</text><text x="60" y="158" text-anchor="start" font-size="20" fill="#2a2f37">Without caching</text><rect x="60" y="170" width="640" height="44" rx="8" fill="#b9b2a2"/><text x="712" y="200" text-anchor="start" font-size="22" font-weight="700" fill="#14171c">250M</text><text x="60" y="258" text-anchor="start" font-size="20" fill="#2a2f37">With caching</text><rect x="60" y="270" width="69" height="44" rx="8" fill="#e46f22"/><text x="141" y="300" text-anchor="start" font-size="22" font-weight="700" fill="#14171c">27M</text><text x="900" y="300" text-anchor="end" font-size="44" font-weight="800" fill="#e46f22">89% less</text><line x1="60" y1="350" x2="900" y2="350" stroke="#cfc8b8"/><text x="60" y="400" text-anchor="start" font-size="24" font-weight="700" fill="#14171c">36 research runs moved off Claude</text><text x="60" y="436" text-anchor="start" font-size="22" fill="#2f6fd6">~4.5M Claude tokens not spent (estimate)</text><text x="60" y="500" text-anchor="start" font-size="15" fill="#5d6470">Measured over 530 requests, Nov 2026. Weights: cache read ×0.1, write ×2, output ×5.</text></svg>