<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" height="660" font-family="Heebo, Inter, Arial, sans-serif" role="img" aria-label="KesherAI — what each saving is worth"><rect width="1100" height="660" rx="24" fill="#f4f1ea"/><text x="60" y="64" text-anchor="start" font-size="32" font-weight="800" fill="#14171c">KesherAI — what each saving is worth</text><text x="60" y="98" text-anchor="start" font-size="17" fill="#5d6470">Effective cost, millions of tokens (approx. input units) · same work, different setups · % = less than "Nothing"</text><line x1="80" y1="520" x2="1040" y2="520" stroke="#14171c" stroke-width="2"/><rect x="115" y="200" width="86" height="320" rx="6" fill="#9a9284"/><text x="158" y="162" text-anchor="middle" font-size="22" font-weight="800" fill="#14171c">372.2M</text><text x="158" y="188" text-anchor="middle" font-size="20" font-weight="800" fill="#5d6470" direction="ltr">baseline</text><text x="158" y="554" text-anchor="middle" font-size="19" font-weight="500" fill="#14171c">Nothing</text><rect x="272" y="483" width="86" height="37" rx="6" fill="#c9a27e"/><text x="315" y="445" text-anchor="middle" font-size="22" font-weight="800" fill="#14171c">43.3M</text><text x="315" y="471" text-anchor="middle" font-size="20" font-weight="800" fill="#1f7a4d" direction="ltr">−88%</text><text x="315" y="554" text-anchor="middle" font-size="19" font-weight="500" fill="#14171c">Caching only</text><rect x="429" y="491" width="86" height="29" rx="6" fill="#d7894e"/><text x="472" y="453" text-anchor="middle" font-size="22" font-weight="800" fill="#14171c">34M</text><text x="472" y="479" text-anchor="middle" font-size="20" font-weight="800" fill="#1f7a4d" direction="ltr">−91%</text><text x="472" y="554" text-anchor="middle" font-size="19" font-weight="500" fill="#14171c">Without agent</text><text x="472" y="578" text-anchor="middle" font-size="19" font-weight="500" fill="#14171c">split</text><rect x="585" y="492" width="86" height="28" rx="6" fill="#d7894e"/><text x="628" y="454" text-anchor="middle" font-size="22" font-weight="800" fill="#14171c">32.2M</text><text x="628" y="480" text-anchor="middle" font-size="20" font-weight="800" fill="#1f7a4d" direction="ltr">−91%</text><text x="628" y="554" text-anchor="middle" font-size="19" font-weight="500" fill="#14171c">Without new</text><text x="628" y="578" text-anchor="middle" font-size="19" font-weight="500" fill="#14171c">chat + handoff</text><rect x="742" y="493" width="86" height="27" rx="6" fill="#d7894e"/><text x="785" y="455" text-anchor="middle" font-size="22" font-weight="800" fill="#14171c">31.5M</text><text x="785" y="481" text-anchor="middle" font-size="20" font-weight="800" fill="#1f7a4d" direction="ltr">−92%</text><text x="785" y="554" text-anchor="middle" font-size="19" font-weight="500" fill="#14171c">Without</text><text x="785" y="578" text-anchor="middle" font-size="19" font-weight="500" fill="#14171c">research</text><text x="785" y="602" text-anchor="middle" font-size="19" font-weight="500" fill="#14171c">offload</text><rect x="899" y="497" width="86" height="23" rx="6" fill="#e46f22"/><text x="942" y="459" text-anchor="middle" font-size="22" font-weight="800" fill="#14171c">27.2M</text><text x="942" y="485" text-anchor="middle" font-size="20" font-weight="800" fill="#1f7a4d" direction="ltr">−93%</text><text x="942" y="554" text-anchor="middle" font-size="19" font-weight="800" fill="#14171c">Everything</text><text x="60" y="636" text-anchor="start" font-size="15" fill="#5d6470">Measured: caching (530 requests) and research count. The other columns are estimates; assumptions in docs/token-savings.</text></svg>