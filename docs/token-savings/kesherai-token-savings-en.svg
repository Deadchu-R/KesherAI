<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Heebo, Inter, Arial, sans-serif" role="img" aria-label="KesherAI token savings"><rect width="1000" height="620" rx="24" fill="#f4f1ea"/><text x="60" y="66" text-anchor="start" font-size="34" font-weight="800" fill="#14171c">KesherAI — with vs without</text><text x="60" y="100" text-anchor="start" font-size="19" font-weight="400" fill="#5d6470">Millions of tokens (approx. input units). Grey = without, orange = with</text><text x="60" y="150" text-anchor="start" font-size="22" font-weight="700" fill="#14171c">Prompt caching (measured)</text><rect x="60" y="164" width="550" height="30" rx="6" fill="#b9b2a2"/><text x="620" y="186" text-anchor="start" font-size="20" font-weight="700" fill="#14171c">250.2M</text><rect x="60" y="208" width="59" height="30" rx="6" fill="#e46f22"/><text x="129" y="230" text-anchor="start" font-size="20" font-weight="700" fill="#14171c">27M</text><text x="60" y="286" text-anchor="start" font-size="22" font-weight="700" fill="#14171c">Research moved to Antigravity / free Gemini (estimate)</text><rect x="60" y="300" width="10" height="30" rx="6" fill="#b9b2a2"/><text x="80" y="322" text-anchor="start" font-size="20" font-weight="700" fill="#14171c">4.5M</text><rect x="60" y="344" width="4" height="30" rx="6" fill="#e46f22"/><text x="74" y="366" text-anchor="start" font-size="20" font-weight="700" fill="#14171c">0.2M</text><text x="60" y="422" text-anchor="start" font-size="22" font-weight="700" fill="#14171c">All together</text><rect x="60" y="436" width="560" height="30" rx="6" fill="#b9b2a2"/><text x="630" y="458" text-anchor="start" font-size="20" font-weight="700" fill="#14171c">254.7M</text><rect x="60" y="480" width="60" height="30" rx="6" fill="#e46f22"/><text x="130" y="502" text-anchor="start" font-size="20" font-weight="700" fill="#14171c">27.2M</text><text x="940" y="548" text-anchor="end" font-size="40" font-weight="800" fill="#e46f22">≈89% less in total</text><text x="60" y="590" text-anchor="start" font-size="15" font-weight="400" fill="#5d6470">Caching measured over 530 requests. Research: 36 reports × ≈125K tokens per helper run. Nov 2026.</text></svg>