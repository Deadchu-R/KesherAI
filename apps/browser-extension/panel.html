<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #16171b; color: #e9e9ee; font: 13px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  .bar { display: flex; gap: 6px; padding: 6px; border-bottom: 1px solid #2a2c33; }
  button { flex: 1; padding: 7px; border-radius: 8px; border: 0; background: #2a2d36; color: inherit; font: inherit; cursor: pointer; }
  button:hover { background: #343844; }
  iframe { flex: 1; border: 0; width: 100%; }
  .off { padding: 16px; color: #a9a9b3; line-height: 1.5; }
</style>
</head>
<body>
  <div class="bar">
    <button id="ask" type="button">📄 Ask about this page</button>
    <button id="home" type="button">💬 New chat</button>
  </div>
  <iframe id="app" title="KesherAI" allow="clipboard-write; microphone"></iframe>
  <script src="panel.js"></script>
</body>
</html>
