<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; background: #16171b; color: #e9e9ee; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  p { margin: 6px 0; color: #a9a9b3; font-size: 12.5px; line-height: 1.45; }
  label { display: block; margin: 10px 0 4px; font-size: 12.5px; }
  input { width: 100%; box-sizing: border-box; padding: 7px 8px; border-radius: 8px; border: 1px solid #383a42; background: #0f1013; color: inherit; font: inherit; }
  button { margin-top: 10px; width: 100%; padding: 8px; border-radius: 8px; border: 0; background: #5b7fe0; color: #fff; font: inherit; cursor: pointer; }
  .state { font-weight: 600; }
  .on { color: #7bd88f; } .bad { color: #ff8a80; }
</style>
</head>
<body>
  <h1>KesherAI</h1>
  <p class="state" id="state">…</p>
  <label for="key">Connection key (KesherAI → Settings → Browser)</label>
  <input id="key" autocomplete="off" spellcheck="false">
  <label for="port">Port</label>
  <input id="port" type="number" value="7420">
  <button id="save" type="button">Connect</button>
  <p>KesherAI asks you before it opens, clicks or types anything, unless you set it to run on its own. It never types passwords.</p>
  <script src="popup.js"></script>
</body>
</html>
