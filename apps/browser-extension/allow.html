<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>KesherAI</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; padding: 18px; background: #16171b; color: #e9e9ee; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  p { margin: 6px 0; color: #a9a9b3; font-size: 13px; line-height: 1.5; }
  b#site { color: #e9e9ee; direction: ltr; unicode-bidi: isolate; }
  button { margin-top: 10px; width: 100%; padding: 9px; border-radius: 8px; border: 1px solid #383a42; background: #1e1f24; color: #e9e9ee; font: inherit; cursor: pointer; }
  button.pri { background: #5b7fe0; border-color: #5b7fe0; color: #fff; font-weight: 600; }
</style>
</head>
<body>
  <h1 id="title">KesherAI needs this site</h1>
  <p id="why">A task in KesherAI wants to read or use <b id="site"></b>. The browser asks you first.</p>
  <button id="one" class="pri" type="button">Allow on this site</button>
  <button id="all" type="button">Allow on all sites</button>
  <button id="no" type="button">Not now</button>
  <script src="allow.js"></script>
</body>
</html>
