<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#121213" />
  <title>KesherAI · On this phone</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body { height: 100dvh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top)); border-bottom: 1px solid var(--border); background: var(--panel); }
    header h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 500; }
    .icon { width: 40px; min-height: 40px; padding: 0; border: 0; background: transparent; color: var(--muted); font-size: 20px; }
    main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .intro { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .model { border: 1px solid var(--border); background: var(--panel); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .model.active { border-color: var(--accent); }
    .model .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .model strong { font-weight: 500; }
    .model .size { color: var(--muted); font-size: 13px; direction: ltr; }
    .model p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
    .model .row { display: flex; gap: 8px; }
    .model .row button { flex: 1; min-height: 42px; font-size: 15px; }
    .rating { font-size: 12.5px; font-weight: 500; }
    .model.dim { opacity: .62; }
    .rating.good { color: #6fd3a5; }
    .rating.ok { color: var(--accent); }
    .rating.slow { color: var(--live); }
    .rating.bad { color: var(--bad); }
    .gpu-opt { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--muted); line-height: 1.5; padding: 4px 2px 8px; }
    .gpu-opt { flex-wrap: wrap; align-items: center; }
    .gpu-opt select { flex: 1; min-width: 0; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); padding: 0 8px; font-size: 13.5px; }
    .tag { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--raised); color: var(--accent); }
    .bar { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; }
    .bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
    .msgs { display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 88%; line-height: 1.55; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .msg.user { align-self: flex-start; background: var(--raised); padding: 10px 14px; border-radius: 16px; }
    .msg.assistant { align-self: stretch; }
    .msg.note { align-self: center; color: var(--muted); font-size: 13px; }
    footer { padding: 10px 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--bg); }
    .composer { display: flex; gap: 8px; align-items: flex-end; border: 1px solid var(--border); background: var(--panel); border-radius: 18px; padding: 8px; }
    .composer textarea { flex: 1; resize: none; border: 0; background: transparent; outline: none; font-size: 16px; line-height: 1.4; max-height: 30vh; padding: 6px 4px; }
    .composer .web { background: transparent; border: 1px solid var(--border); font-size: 17px; filter: grayscale(1); opacity: .65; }
    .composer .web.on { background: rgb(152 163 255 / 0.16); border-color: rgb(152 163 255 / 0.5); filter: none; opacity: 1; }
    .composer button { min-height: 40px; width: 40px; padding: 0; border-radius: 12px; font-size: 18px; }
    .queue { display: grid; gap: 4px; margin: 0 2px 8px; }
    .q-head { font-size: 12px; color: var(--muted); padding: 0 4px; }
    .q-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 12px; background: var(--raised); border: 1px dashed rgb(255 255 255 / 0.14); font-size: 14px; }
    .q-n { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; background: var(--panel-2); color: var(--muted); flex: none; }
    .q-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .q-item button { min-height: 32px; width: 32px; padding: 0; border: 0; background: transparent; color: var(--muted); }
    .tune-bar { height: 5px; border-radius: 3px; background: var(--raised); overflow: hidden; margin: 0 4px 6px; }
    .tune-bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
    .status { font-size: 12.5px; color: var(--muted); margin: 0 4px 6px; min-height: 1em; }
    .error { color: var(--bad); }
    [hidden] { display: none !important; }
  </style>
</head>
<body class="kd-has-header">
  <header>
    <button class="icon" id="back" type="button" aria-label="Back">→</button>
    <h1 id="title" data-he="בטלפון הזה" data-en="On this phone">בטלפון הזה</h1>
    <button class="icon" id="newChat" type="button" aria-label="New chat" hidden>＋</button>
    <button class="icon" id="menu" type="button" aria-label="Menu" hidden>☰</button>
  </header>

  <main id="modelsView">
    <p class="intro" data-he="מודלים קטנים שרצים על הטלפון עצמו, בלי מחשב ובלי אינטרנט (אחרי ההורדה). הם מהירים פחות וחכמים פחות ממודלים במחשב, אבל עובדים בכל מקום." data-en="Small models that run on the phone itself, with no computer and no internet (after the download). They are slower and less capable than models on your computer, but work anywhere.">מודלים קטנים שרצים על הטלפון עצמו, בלי מחשב ובלי אינטרנט (אחרי ההורדה). הם מהירים פחות וחכמים פחות ממודלים במחשב, אבל עובדים בכל מקום.</p>
    <p class="intro" id="memNote"></p>
    <div id="modelList"></div>
  </main>

  <main id="chatView" hidden>
    <div class="msgs" id="msgs"></div>
  </main>
  <footer id="chatFoot" hidden>
    <div class="tune-bar" id="tuneBar" hidden><span></span></div>
    <p class="status" id="status"></p>
    <div class="queue" id="queue" hidden></div>
    <form class="composer" id="composer">
      <button type="button" id="web" class="web" aria-pressed="false" title="Search the web">🌐</button>
      <textarea id="input" rows="1" data-ph-he="כתוב הודעה…" data-ph-en="Write a message…" placeholder="כתוב הודעה…"></textarea>
      <button class="primary" id="send" type="submit" aria-label="Send">↑</button>
    </form>
  </footer>

<script type="module">
  import { Wllama } from "./vendor/wllama/index.js";

  const $ = (id) => document.getElementById(id);
  const lang = localStorage.getItem("lang") || (navigator.language.startsWith("he") ? "he" : "en");
  const he = lang === "he";
  document.documentElement.lang = lang;
  document.documentElement.dir = he ? "rtl" : "ltr";
  for (const el of document.querySelectorAll("[data-he]")) el.textContent = el.dataset[lang];
  $("input").placeholder = $("input").dataset[he ? "phHe" : "phEn"];
  $("back").textContent = he ? "→" : "←";
  const T = (h, e) => (he ? h : e);

  // Small chat models that fit a phone. The file (Q4_K_M) is looked up on Hugging Face when listed.
  const CATALOG = [
    { repo: "Qwen/Qwen2.5-0.5B-Instruct-GGUF", name: "Qwen 2.5 · 0.5B", ram: 2, he: "הכי קטן ומהיר. טוב לשאלות קצרות ולתרגום פשוט.", en: "Smallest and fastest. Good for short questions and simple translation." },
    { repo: "bartowski/Llama-3.2-1B-Instruct-GGUF", name: "Llama 3.2 · 1B", ram: 3, he: "מאוזן. עונה יפה באנגלית, סביר בעברית.", en: "Balanced. Answers well in English, fair in Hebrew." },
    { repo: "bartowski/google_gemma-3-1b-it-GGUF", name: "Gemma 3 · 1B", ram: 3, he: "של Google. כתיבה טובה ושפות רבות.", en: "From Google. Good writing and many languages." },
    { repo: "Qwen/Qwen2.5-1.5B-Instruct-GGUF", name: "Qwen 2.5 · 1.5B", ram: 4, he: "הכי חכם מהרשימה שעדיין רץ חלק בטלפון טוב. תומך בעברית.", en: "The smartest here that still runs smoothly on a good phone. Handles Hebrew." },
    { repo: "unsloth/Qwen3-1.7B-GGUF", name: "Qwen 3 · 1.7B", ram: 4, he: "חדש יותר, חושב לפני שעונה (איטי יותר).", en: "Newer; thinks before answering (slower)." },
    // Bigger models: fast only with a strong graphics chip (e.g. Snapdragon 8 Elite / Adreno 830) after tuning.
    { repo: "Qwen/Qwen2.5-3B-Instruct-GGUF", name: "Qwen 2.5 · 3B", ram: 6, big: true, he: "חכם בהרבה, טוב בעברית ובקוד. לטלפונים עם כרטיס גרפי חזק.", en: "Much smarter, good at Hebrew and code. For phones with a strong graphics chip." },
    { repo: "bartowski/Llama-3.2-3B-Instruct-GGUF", name: "Llama 3.2 · 3B", ram: 6, big: true, he: "חזק באנגלית, כתיבה וסיכומים. לטלפונים עם כרטיס גרפי חזק.", en: "Strong in English, writing and summaries. For phones with a strong graphics chip." },
    { repo: "bartowski/google_gemma-3-4b-it-GGUF", name: "Gemma 3 · 4B", ram: 7, big: true, he: "הכי חכם ברשימה, הרבה שפות. דחוס יותר כדי להיכנס לטלפון.", en: "The smartest here, many languages. Compressed more to fit a phone." },
    { repo: "unsloth/Qwen3-4B-GGUF", name: "Qwen 3 · 4B", ram: 7, big: true, he: "חושב לפני שעונה, חזק בהיגיון ובקוד. דחוס יותר כדי להיכנס.", en: "Thinks before answering, strong at reasoning and code. Compressed more to fit." },
  ];
  const deviceGb = navigator.deviceMemory || 4; // Android reports up to 8
  /** The graphics chip, and whether it is strong enough for 3–4B models (recent Adreno, Immortalis, Xclipse). */
  let gpu = { name: "", strong: false };
  try {
    const adapter = await navigator.gpu?.requestAdapter();
    const info = adapter?.info ?? (await adapter?.requestAdapterInfo?.());
    const name = [info?.vendor, info?.architecture, info?.description].filter(Boolean).join(" ");
    gpu = { name, strong: !!adapter && /qualcomm|adreno|immortalis|xclipse|apple/i.test(name) && deviceGb >= 8 };
  } catch {
    // no WebGPU here
  }
  $("memNote").textContent = T(`בטלפון הזה יש בערך ${deviceGb >= 8 ? "8+" : deviceGb} GB זיכרון ו-${navigator.hardwareConcurrency || "?"} ליבות${gpu.name ? `, כרטיס גרפי: ${gpu.name}${gpu.strong ? " (חזק: גם מודלים של 3–4B יכולים לרוץ מהר אחרי כיוונון)" : ""}` : ""}. ליד כל מודל כתוב כמה טוב הוא ירוץ כאן; אחרי שיחה זה מתעדכן לפי המהירות שנמדדה.`, `This phone has about ${deviceGb >= 8 ? "8+" : deviceGb} GB of memory and ${navigator.hardwareConcurrency || "?"} cores${gpu.name ? `, graphics: ${gpu.name}${gpu.strong ? " (strong: 3–4B models can run fast once tuned)" : ""}` : ""}. Each model says how well it will run here; after you chat, it updates with the measured speed.`);

  // ---------- keep working in the background (Android foreground service with a notification) ----------
  const BG = window.Capacitor?.Plugins?.KesherBackground;
  const jobs = new Map(); // id → { title, text, progress }
  let bgTimer;
  function bg(id, job) {
    if (job) jobs.set(id, job);
    else jobs.delete(id);
    clearTimeout(bgTimer);
    // Batch updates: Android limits how often a notification may change.
    bgTimer = setTimeout(() => {
      if (!BG) return;
      const all = [...jobs.values()];
      if (!all.length) return void BG.stop().catch(() => undefined);
      const main = all[0];
      const text = all.length > 1 ? `${main.text} · ${T(`ועוד ${all.length - 1}`, `+${all.length - 1} more`)}` : main.text;
      BG.start({ title: main.title, text, progress: main.progress ?? -1 }).catch(() => undefined);
    }, 400);
  }
  const doneNotice = (title, text) => { if (document.hidden) BG?.notify({ title, text }).catch(() => undefined); };

  const wllama = new Wllama({ default: new URL("./vendor/wllama/wllama.wasm", location.href).href }, { allowOffline: true, suppressNativeLog: true });
  const mm = wllama.modelManager;
  const urlOf = (repo, file) => `https://huggingface.co/${repo}/resolve/main/${file}`;
  const gb = (b) => (b / 1024 ** 3).toFixed(b < 1024 ** 3 ? 2 : 1) + " GB";

  async function fileFor(item) {
    const key = "kesherai-phone-file2:" + item.repo;
    const cached = localStorage.getItem(key);
    if (cached) return JSON.parse(cached);
    const res = await fetch(`https://huggingface.co/api/models/${item.repo}/tree/main`);
    if (!res.ok) throw new Error(`Hugging Face ${res.status}`);
    // The best quality that still fits one file the phone can load (under 2 GB).
    const PREF = ["q4_k_m", "q4_k_s", "iq4_xs", "q4_0", "q3_k_l", "iq3_m", "q3_k_m", "iq3_xs", "q3_k_s"];
    const all = (await res.json()).filter((f) => /\.gguf$/i.test(f.path) && !/-\d{5}-of-\d{5}|mmproj/i.test(f.path)).map((f) => ({ path: f.path, size: f.size ?? f.lfs?.size ?? 0 }));
    const fits = all.filter((f) => f.size > 0 && f.size < 1.95 * 1024 ** 3);
    let pick;
    for (const q of PREF) { pick = fits.find((f) => f.path.toLowerCase().includes(q)); if (pick) break; }
    if (!pick) throw new Error(T("אין גרסה שנכנסת לטלפון", "No version small enough for a phone"));
    const quant = /(i?q\d_[a-z0-9_]+)/i.exec(pick.path)?.[1]?.toUpperCase() ?? "";
    const f = { path: pick.path, size: pick.size, quant };
    localStorage.setItem(key, JSON.stringify(f));
    return f;
  }

  // ---------- how well each model runs on this phone ----------
  const cores = navigator.hardwareConcurrency || 4;
  const SPEED = (url) => "kesherai-phone-speed:" + url;
  const runMode = () => (navigator.gpu ? localStorage.getItem("kesherai-phone-mode") || "auto" : "cpu");
  const TUNE = (url) => "kesherai-phone-tune:" + url;
  /** The tuned setup for a model on this phone: graphics-chip layers (0 = processor only), of how many, and its speed. */
  const tuned = (url) => { try { return JSON.parse(localStorage.getItem(TUNE(url)) || "null"); } catch { return null; } };
  const useGpu = () => runMode() !== "cpu";
  /** Measured tokens/s for a model on this phone (average of recent answers), or undefined. */
  const measured = (url) => { const v = Number(localStorage.getItem(SPEED(url))); return v > 0 ? v : undefined; };
  function rememberSpeed(url, tps) {
    if (!(tps > 0) || !Number.isFinite(tps)) return;
    const old = measured(url);
    localStorage.setItem(SPEED(url), String(old ? old * 0.6 + tps * 0.4 : tps));
  }
  /** Rating for a model of this size: speed (measured, else estimated) and whether it fits memory. */
  function rate(sizeBytes, url) {
    const sizeGb = sizeBytes / 1024 ** 3;
    // The app runs llama.cpp in WebAssembly on one processor core (Android web views cannot share memory between threads).
    const t = tuned(url);
    const gpuGain = !useGpu() || !navigator.gpu ? 1 : gpu.strong ? 4 : 2;
    const est = t?.tps ?? (6.5 / Math.max(0.25, sizeGb)) * (cores >= 8 ? 1 : 0.7) * gpuGain;
    const real = measured(url);
    const tps = real ?? est;
    const tooBig = sizeGb * 1.6 > deviceGb * (deviceGb >= 8 ? 0.55 : 0.5);
    const level = tooBig ? "bad" : tps >= 8 ? "good" : tps >= 3 ? "ok" : "slow";
    const text = {
      good: T("רץ טוב בטלפון הזה", "Runs well on this phone"),
      ok: T("רץ, קצת לאט", "Runs, a bit slowly"),
      slow: T("איטי בטלפון הזה", "Slow on this phone"),
      bad: T("גדול מדי לטלפון הזה", "Too big for this phone"),
    }[level];
    const speed = tooBig ? "" : ` · ${real ? "" : "~"}${tps.toFixed(tps < 10 ? 1 : 0)} ${T("טוקנים/שנייה", "tokens/s")} ${real ? T("(נמדד)", "(measured)") : T("(הערכה)", "(estimate)")}`;
    const how = t && runMode() === "auto" ? ` · ${t.layers === 0 ? T("מעבד", "processor") : t.layers >= t.total ? T("כרטיס גרפי", "graphics chip") : T(`מעבד + כרטיס גרפי (${t.layers}/${t.total} שכבות)`, `processor + graphics chip (${t.layers}/${t.total} layers)`)}` : "";
    return { level, text: text + speed + how, tps, tooBig };
  }

  // Chats from the first version were often garbled (graphics chip), so start them fresh once.
  if (localStorage.getItem("kesherai-phone-v") !== "2") {
    for (const k of Object.keys(localStorage)) if (k.startsWith("kesherai-phone-chat:")) localStorage.removeItem(k);
    localStorage.setItem("kesherai-phone-v", "2");
  }

  let downloaded = [];
  let activeUrl = localStorage.getItem("kesherai-phone-model") || "";
  async function renderList() {
    downloaded = await mm.getModels().catch(() => []);
    const list = $("modelList");
    list.replaceChildren();
    // How models use the phone: tuned automatically (processor + graphics chip, checked for correct output), or forced.
    const modeRow = document.createElement("label");
    modeRow.className = "gpu-opt";
    modeRow.innerHTML = `<span></span><select><option value="auto"></option><option value="cpu"></option><option value="gpu"></option></select>`;
    modeRow.querySelector("span").textContent = T("איך להריץ:", "How to run:");
    const sel = modeRow.querySelector("select");
    sel.options[0].textContent = T("אוטומטי: מעבד + כרטיס גרפי, נבדק שאין תקלות (מומלץ)", "Automatic: processor + graphics chip, checked for mistakes (recommended)");
    sel.options[1].textContent = T("רק מעבד (הכי בטוח)", "Processor only (safest)");
    sel.options[2].textContent = T("הכול על הכרטיס הגרפי (בלי בדיקה)", "All on the graphics chip (no check)");
    sel.value = runMode();
    sel.onchange = () => { localStorage.setItem("kesherai-phone-mode", sel.value); if (wllama.isModelLoaded()) { wllama.exit(); wllama.__url = ""; } renderList(); };
    if (!navigator.gpu) { sel.value = "cpu"; sel.disabled = true; modeRow.append(Object.assign(document.createElement("small"), { textContent: T(" (הטלפון לא מאפשר גישה לכרטיס הגרפי כאן)", " (this phone does not offer its graphics chip here)") })); }
    list.append(modeRow);

    const rows = await Promise.all(CATALOG.map(async (item) => {
      try { return { item, file: await fileFor(item) }; } catch (e) { return { item, error: e }; }
    }));
    // Recommended: the biggest model that runs well here; otherwise the fastest one that fits.
    const rated = rows.filter((r) => r.file).map((r) => ({ ...r, url: urlOf(r.item.repo, r.file.path), rating: rate(r.file.size, urlOf(r.item.repo, r.file.path)) }));
    const good = rated.filter((r) => r.rating.level === "good").sort((x, y) => y.file.size - x.file.size)[0];
    const fallback = rated.filter((r) => !r.rating.tooBig).sort((x, y) => y.rating.tps - x.rating.tps)[0];
    const recUrl = (good ?? fallback)?.url;
    // Also point out the fastest one that still runs well, for quick answers.
    const quick = rated.filter((r) => r.rating.level === "good" && r.url !== recUrl).sort((x, y) => y.rating.tps - x.rating.tps)[0]?.url;

    const rank = (r) => { const u = r.file ? urlOf(r.item.repo, r.file.path) : ""; return u === recUrl ? 0 : u === quick ? 1 : r.file ? 2 + (rate(r.file.size, u).tooBig ? 5 : 0) : 9; };
    rows.sort((a, b) => rank(a) - rank(b));
    for (const r of rows) {
      const item = r.item;
      const card = document.createElement("div");
      card.className = "model";
      card.innerHTML = `<div class="top"><strong></strong><span class="size"></span></div><span class="rating"></span><p></p><div class="bar" hidden><span></span></div><div class="row"></div>`;
      card.querySelector("strong").textContent = item.name;
      card.querySelector("p").textContent = item[lang];
      list.append(card);
      const row = card.querySelector(".row");
      if (!r.file) {
        card.querySelector(".rating").remove();
        row.textContent = navigator.onLine ? String(r.error?.message || r.error) : T("צריך אינטרנט כדי להוריד.", "Needs the internet to download.");
        continue;
      }
      const file = r.file;
      const url = urlOf(item.repo, file.path);
      const rating = rate(file.size, url);
      card.querySelector(".size").textContent = (file.size ? gb(file.size) : "") + (file.quant ? ` · ${file.quant}` : "");
      const badge = card.querySelector(".rating");
      badge.textContent = rating.text;
      badge.className = `rating ${rating.level}`;
      if (url === recUrl) card.querySelector(".top").append(Object.assign(document.createElement("span"), { className: "tag", textContent: T("מומלץ לטלפון הזה", "Best for this phone") }));
      else if (url === quick) card.querySelector(".top").append(Object.assign(document.createElement("span"), { className: "tag", textContent: T("הכי מהיר", "Fastest") }));
      if (item.big && !gpu.strong) card.classList.add("dim");
      const have = downloaded.find((m) => m.url === url && m.size > 0);
      if (url === activeUrl && have) card.classList.add("active");
      const btn = (label, cls, fn) => { const b = document.createElement("button"); b.type = "button"; b.textContent = label; if (cls) b.className = cls; b.onclick = fn; row.append(b); return b; };
      if (have) {
        btn(T("פתח צ'אט", "Open chat"), "primary", () => openChat(item, url));
        if (runMode() === "auto" && tuned(url)) btn(T("כוונן שוב", "Retune"), "", () => { localStorage.removeItem(TUNE(url)); renderList(); });
        btn(T("מחק", "Delete"), "", async () => { await have.remove(); if (activeUrl === url) { activeUrl = ""; localStorage.removeItem("kesherai-phone-model"); } renderList(); });
      } else {
        const dl = btn(T("הורד", "Download") + (file.size ? ` (${gb(file.size)})` : ""), rating.tooBig ? "" : "primary", async () => {
          dl.disabled = true;
          const bar = card.querySelector(".bar");
          bar.hidden = false;
          try {
            await mm.downloadModel(url, {
              progressCallback: ({ loaded, total }) => {
                const pct = total ? Math.round((loaded / total) * 100) : 0;
                bar.firstElementChild.style.width = `${pct}%`;
                dl.textContent = `${T("מוריד", "Downloading")} ${pct}%`;
                bg(`dl:${url}`, { title: T(`מוריד את ${item.name}`, `Downloading ${item.name}`), text: `${pct}% · ${gb(loaded)} / ${gb(total || file.size)}`, progress: pct });
              },
            });
            bg(`dl:${url}`);
            doneNotice(T("ההורדה הסתיימה", "Download finished"), T(`${item.name} מוכן לשיחה בטלפון`, `${item.name} is ready to chat on the phone`));
            renderList();
          } catch (e) {
            bg(`dl:${url}`);
            dl.disabled = false;
            dl.textContent = T("נסה שוב", "Try again");
            card.querySelector("p").textContent = T("ההורדה נכשלה: ", "Download failed: ") + (e.message || e);
          }
        });
      }
    }
  }

  // ---------- chat ----------
  let messages = [];
  let current = null; // { item, url }
  let abort = null;
  const HISTORY = (url) => "kesherai-phone-chat:" + url;

  function show(view) {
    const chat = view === "chat";
    $("modelsView").hidden = chat;
    $("chatView").hidden = !chat;
    $("chatFoot").hidden = !chat;
    $("newChat").hidden = !chat;
    $("title").textContent = chat ? current.item.name : T("בטלפון הזה", "On this phone");
  }

  function addMsg(role, text) {
    const el = Object.assign(document.createElement("div"), { className: `msg ${role}`, textContent: text, dir: "auto" });
    $("msgs").append(el);
    $("chatView").scrollTop = $("chatView").scrollHeight;
    return el;
  }

  async function openChat(item, url) {
    current = { item, url };
    activeUrl = url;
    localStorage.setItem("kesherai-phone-model", url);
    try { messages = JSON.parse(localStorage.getItem(HISTORY(url)) || "[]"); } catch { messages = []; }
    $("msgs").replaceChildren();
    for (const m of messages) addMsg(m.role, m.content);
    show("chat");
    if (!wllama.isModelLoaded() || wllama.__url !== url) {
      $("status").textContent = T("טוען את המודל לזיכרון…", "Loading the model into memory…");
      $("send").disabled = true;
      try {
        if (wllama.isModelLoaded()) await wllama.exit();
        const model = (await mm.getModels()).find((m) => m.url === url);
        const threads = Math.max(1, Math.min(4, cores));
        const load = (layers, extra = {}) => wllama.loadModel(model, { n_ctx: 2048, n_threads: threads, n_gpu_layers: layers, warmup: false, ...extra });
        const mode = runMode();
        if (mode === "cpu") await load(0);
        else if (mode === "gpu") await load(999);
        else {
          let t = tuned(url);
          if (!t) t = await tune(url, load, model?.size ?? 1024 ** 3);
          await load(t.layers, t.extra ?? {});
        }
        wllama.__url = url;
        $("status").textContent = "";
      } catch (e) {
        $("status").innerHTML = "";
        $("status").append(Object.assign(document.createElement("span"), { className: "error", textContent: T("לא הצלחתי לטעון: ", "Could not load: ") + (e.message || e) }));
      } finally {
        $("send").disabled = false;
      }
    }
  }

  /**
   * Checks that the loaded setup computes correctly: one short question with
   * a known answer (counting), no randomness, and how fast it answered.
   *
   * @returns { ok, tps }
   */
  async function check() {
    try {
      const t0 = performance.now();
      const r = await wllama.createChatCompletion({ messages: [{ role: "user", content: "Count from 1 to 6, separated by commas. Only the numbers." }], max_tokens: 14, temp: 0, temperature: 0, top_k: 1 });
      const text = r.choices?.[0]?.message?.content ?? "";
      const n = r.usage?.completion_tokens ?? Math.max(1, Math.round(text.length / 2));
      const ok = /1\D{1,3}2\D{1,3}3\D{1,3}4/.test(text) && !/\uFFFD/.test(text);
      return { ok, tps: n / ((performance.now() - t0) / 1000) };
    } catch {
      return { ok: false, tps: 0 };
    }
  }

  /**
   * Finds a fast setup that gives correct answers on this phone, quickly:
   * graphics-chip setups first (safe precision, then default, then split
   * across processor and graphics chip), stopping at the first correct one
   * that is clearly faster than the processor would be. Only if none works
   * does it fall back to the processor (always correct, so not tested).
   * Saved per model; Retune redoes it.
   */
  async function tune(url, load, sizeBytes) {
    const bar = $("tuneBar");
    bar.hidden = false;
    const started = performance.now();
    const cpuGuess = (6.5 / Math.max(0.25, sizeBytes / 1024 ** 3)) * (cores >= 8 ? 1 : 0.7);
    const safe = { flash_attn: false, cache_type_k: "f32", cache_type_v: "f32" };
    let total = 0;
    const tries = [
      { layers: 999, extra: safe },
      { layers: 999, extra: {} },
      { half: 0.5, extra: safe },
      { half: 0.25, extra: safe },
    ];
    let label = "";
    let done = 0;
    const say = (msg) => {
      if (msg) label = msg;
      const pct = Math.min(99, Math.round((done / tries.length) * 100));
      bar.firstElementChild.style.width = pct + "%";
      const secs = Math.round((performance.now() - started) / 1000);
      $("status").textContent = `${pct}% · ${label} · ${T(`${secs} שניות`, `${secs}s`)}`;
      bg("tune", { title: T("מכוונן מודל לטלפון", "Tuning a model for the phone"), text: `${pct}% · ${label}`, progress: pct });
    };
    const tick = setInterval(() => say(), 1000);
    let best = null;
    for (const [i, cfg] of tries.entries()) {
      const layers = cfg.half ? Math.max(1, Math.ceil(total * cfg.half)) : cfg.layers;
      if (cfg.half && !total) { done++; continue; }
      const what = cfg.half ? T(`${layers}/${total} שכבות על הכרטיס הגרפי`, `${layers}/${total} layers on the graphics chip`) : T("הכול על הכרטיס הגרפי", "all on the graphics chip");
      say(T(`ניסיון ${i + 1}/${tries.length}: ${what}`, `Try ${i + 1}/${tries.length}: ${what}`));
      try {
        if (wllama.isModelLoaded()) await wllama.exit();
        // A small context loads faster; the real chat reloads with the full one.
        await load(layers, { ...cfg.extra, n_ctx: 256 });
        total = total || (wllama.getLoadedContextInfo?.().n_layer ?? 28);
        const r = await check();
        done = i + 1;
        if (r.ok && r.tps > cpuGuess * 1.2) {
          best = { layers: Math.min(layers, total), total, tps: r.tps, extra: cfg.extra };
          break;
        }
      } catch {
        done = i + 1; // this setup does not load on this phone
      }
    }
    if (!best) best = { layers: 0, total: total || 28, tps: cpuGuess, extra: {} };
    clearInterval(tick);
    bg("tune");
    doneNotice(T("הכיוונון הסתיים", "Tuning finished"), T(`~${best.tps.toFixed(1)} טוקנים לשנייה`, `~${best.tps.toFixed(1)} tokens/s`));
    bar.firstElementChild.style.width = "100%";
    $("status").textContent = "";
    setTimeout(() => (bar.hidden = true), 1200);
    if (wllama.isModelLoaded()) await wllama.exit();
    localStorage.setItem(TUNE(url), JSON.stringify(best));
    const secs = Math.round((performance.now() - started) / 1000);
    addMsg("note", best.layers === 0
      ? T(`כיוונון (${secs} שניות): הכרטיס הגרפי נתן תשובות שגויות או לא היה מהיר יותר, אז המודל ירוץ על המעבד.`, `Tuned in ${secs}s: the graphics chip gave wrong answers or was not faster, so the model runs on the processor.`)
      : T(`כיוונון (${secs} שניות): ${best.layers >= best.total ? "הכול על הכרטיס הגרפי" : `${best.layers} מתוך ${best.total} שכבות על הכרטיס הגרפי, השאר על המעבד`}, נבדק שהתשובות נכונות (~${best.tps.toFixed(1)} טוקנים/שנייה).`, `Tuned in ${secs}s: ${best.layers >= best.total ? "all on the graphics chip" : `${best.layers} of ${best.total} layers on the graphics chip, the rest on the processor`}, checked for correct answers (~${best.tps.toFixed(1)} tokens/s).`));
    return best;
  }

  // ---------- web search (DuckDuckGo, through the app's native HTTP so websites' CORS rules do not block it) ----------
  const webOn = () => localStorage.getItem("kesherai-phone-web") === "1";
  const paintWeb = () => { $("web").setAttribute("aria-pressed", String(webOn())); $("web").classList.toggle("on", webOn()); $("web").title = T("חיפוש באינטרנט לכל הודעה", "Search the web for each message"); };
  $("web").onclick = () => { localStorage.setItem("kesherai-phone-web", webOn() ? "0" : "1"); paintWeb(); };
  paintWeb();
  async function webSearch(q) {
    const url = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(q.slice(0, 200))}`;
    const http = window.Capacitor?.Plugins?.CapacitorHttp;
    const html = http
      ? String((await http.get({ url, headers: { "User-Agent": "Mozilla/5.0 (Linux; Android) KesherAI" } })).data ?? "")
      : await (await fetch(url)).text();
    const doc = new DOMParser().parseFromString(html, "text/html");
    return [...doc.querySelectorAll(".result")].slice(0, 6).flatMap((r) => {
      const a = r.querySelector(".result__a");
      if (!a) return [];
      let href = a.getAttribute("href") || "";
      const m = /[?&]uddg=([^&]+)/.exec(href);
      if (m) href = decodeURIComponent(m[1]);
      if (href.startsWith("//")) href = "https:" + href;
      return [{ title: a.textContent.trim(), url: href, snippet: (r.querySelector(".result__snippet")?.textContent ?? "").trim() }];
    });
  }

  // ---------- message queue: send more while it answers; each goes when it is free ----------
  const queue = [];
  let stoppedByUser = false;
  function paintQueue() {
    const box = $("queue");
    box.hidden = queue.length === 0;
    box.replaceChildren(...queue.map((q, i) => {
      const li = document.createElement("div");
      li.className = "q-item";
      li.innerHTML = `<span class="q-n"></span><span class="q-text" dir="auto"></span><button type="button" aria-label="Remove">✕</button>`;
      li.querySelector(".q-n").textContent = String(i + 1);
      li.querySelector(".q-text").textContent = q;
      li.querySelector("button").onclick = () => { queue.splice(i, 1); paintQueue(); };
      return li;
    }));
    if (queue.length) box.prepend(Object.assign(document.createElement("div"), { className: "q-head", textContent: T(`${queue.length} בתור: כל הודעה יוצאת כשהמודל מתפנה`, `${queue.length} queued: each goes when the model is free`) }));
    paintSend();
  }
  /** While answering: ↑ queues what you typed, ■ (empty box) stops. */
  function paintSend() {
    $("send").textContent = abort && !$("input").value.trim() ? "■" : "↑";
    $("send").setAttribute("aria-label", abort && !$("input").value.trim() ? "Stop" : abort ? T("הוסף לתור", "Add to the queue") : "Send");
  }
  $("input").addEventListener("input", paintSend);

  $("composer").onsubmit = async (e) => {
    e.preventDefault();
    const typed = $("input").value.trim();
    if (abort) {
      if (!typed) { abort.abort(); return; }
      queue.push(typed);
      $("input").value = "";
      autosize();
      paintQueue();
      return;
    }
    const text = typed || queue.shift() || "";
    if (typed === "" && text) paintQueue();
    if (!text || !wllama.isModelLoaded()) return;
    $("input").value = "";
    autosize();
    messages.push({ role: "user", content: text });
    addMsg("user", text);
    const out = addMsg("assistant", "");
    abort = new AbortController();
    paintSend();
    $("status").textContent = T("חושב…", "Thinking…");
    let reply = "";
    bg("answer", { title: T(`${current.item.name} עונה`, `${current.item.name} is answering`), text: text.slice(0, 80) });
    const started = performance.now();
    let tokens = 0;
    try {
      // Keep the last turns that fit the phone's small context.
      const recent = messages.slice(-12);
      let found = "";
      if (webOn()) {
        $("status").textContent = T("מחפש באינטרנט…", "Searching the web…");
        const results = await webSearch(text).catch((err) => { addMsg("note", T("החיפוש נכשל: ", "Search failed: ") + (err.message || err)); return []; });
        if (results.length) {
          found = results.map((r, i) => `${i + 1}. ${r.title}\n${r.url}\n${r.snippet}`).join("\n");
          addMsg("note", T(`חיפשתי באינטרנט: ${results.length} תוצאות`, `Searched the web: ${results.length} results`));
        }
        $("status").textContent = T("חושב…", "Thinking…");
      }
      const system = { role: "system", content: T("אתה עוזר מועיל. ענה בקצרה ובשפה שבה המשתמש כתב.", "You are a helpful assistant. Answer briefly, in the user's language.") + (found ? `\n\nWeb search results (just now). Answer from them and give the links you used:\n${found}` : "") };
      const stream = await wllama.createChatCompletion({ messages: [system, ...recent], stream: true, max_tokens: 768, temperature: 0.7, temp: 0.7, top_p: 0.9, top_k: 40, penalty_repeat: 1.1, penalty_last_n: 128, abortSignal: abort.signal });
      for await (const chunk of stream) {
        const d = chunk.choices?.[0]?.delta?.content ?? "";
        if (!d) continue;
        reply += d;
        tokens++;
        out.textContent = reply.replace(/<think>[\s\S]*?(<\/think>|$)/g, "").trimStart();
        $("chatView").scrollTop = $("chatView").scrollHeight;
        $("status").textContent = `${(tokens / ((performance.now() - started) / 1000)).toFixed(1)} ${T("מילים לשנייה בערך", "tokens/s")}`;
      }
    } catch (err) {
      if (abort?.signal.aborted) { reply += T(" (נעצר)", " (stopped)"); stoppedByUser = true; }
      else addMsg("note", T("שגיאה: ", "Error: ") + (err.message || err));
    } finally {
      abort = null;
      paintSend();
      bg("answer");
    }
    const seconds = (performance.now() - started) / 1000;
    if (tokens > 8) rememberSpeed(current.url, tokens / seconds);
    const clean = reply.replace(/<think>[\s\S]*?<\/think>/g, "").trim();
    out.textContent = clean;
    messages.push({ role: "assistant", content: clean });
    doneNotice(T("התשובה מוכנה", "The answer is ready"), clean.slice(0, 120));
    // Next in the queue, if any (not after Stop).
    if (queue.length && !stoppedByUser) setTimeout(() => $("composer").requestSubmit(), 50);
    stoppedByUser = false;
    try { localStorage.setItem(HISTORY(current.url), JSON.stringify(messages.slice(-60))); } catch { /* full */ }
  };

  const autosize = () => { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, innerHeight * 0.3) + "px"; };
  $("input").addEventListener("input", autosize);
  $("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer: coarse)").matches) { e.preventDefault(); $("composer").requestSubmit(); } });
  $("newChat").onclick = () => { messages = []; localStorage.removeItem(HISTORY(current.url)); $("msgs").replaceChildren(); $("status").textContent = ""; };
  $("back").onclick = () => { if (!$("chatView").hidden) { show("models"); renderList(); } else location.href = "index.html?switch=1"; };

  renderList()
    .then(async () => {
      // From the side menu ("Chat on this phone"): go straight back into the last chat.
      if (!new URLSearchParams(location.search).has("chat")) return;
      const url = localStorage.getItem("kesherai-phone-model");
      const item = CATALOG.find((c) => url && url.includes(`/${c.repo}/`));
      if (item && downloaded.some((m) => m.url === url && m.size > 0)) await openChat(item, url);
    })
    .catch((e) => { $("modelList").textContent = String(e.message || e); });
</script>
<script src="drawer.js"></script>
</body>
</html>
