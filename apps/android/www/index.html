<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1420" />
  <link rel="stylesheet" href="theme.css" />
  <title>KesherAI</title>
  <style>
    :root { color-scheme: dark; --bg: #0f1420; --panel: #131927; --border: #232c42; --text: #e8ecf4; --muted: #9aa3b8; --accent: #8b9cff; --bad: #ff9b9b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: Rubik, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px; }
    main { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; }
    h1 { margin: 0; font-size: 26px; display: flex; gap: 10px; align-items: center; }
    p { margin: 0; color: var(--muted); line-height: 1.5; font-size: 15px; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
    input { height: 48px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 0 12px; font-size: 15px; direction: ltr; }
    button { height: 48px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 16px; }
    button.primary { background: var(--accent); color: var(--bg); border: none; font-weight: 600; }
    .error { color: var(--bad); }
    .update { border: 1px solid var(--accent); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .update[hidden] { display: none; }
    .changes { display: flex; flex-direction: column; gap: 6px; }
    .changes[hidden] { display: none; }
    .changes ul { margin: 0; padding-inline-start: 18px; max-height: 40vh; overflow-y: auto; font-size: 13.5px; line-height: 1.5; color: var(--text); display: flex; flex-direction: column; gap: 4px; }
    .changes li.more { list-style: none; color: var(--muted); }
    .small-head { font-size: 12.5px; color: var(--muted); }
    .row { display: flex; gap: 10px; }
    .row button { flex: 1; }
    .small { font-size: 13px; text-align: center; }
    button.local { border-style: dashed; color: var(--accent); }
    .computers { display: flex; flex-direction: column; gap: 8px; }
    .computers[hidden] { display: none; }
    .computer { display: flex; gap: 8px; }
    .computer button.go { flex: 1; text-align: start; padding: 10px 14px; height: auto; display: flex; flex-direction: column; gap: 2px; }
    .computer button.go small { color: var(--muted); font-size: 12px; direction: ltr; }
    .computer button.del { width: 48px; flex: none; }
    ol { margin: 0; padding-inline-start: 20px; color: var(--muted); font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
<main>
  <div id="update" class="update" hidden>
    <strong id="updateText"></strong>
    <div id="changes" class="changes" hidden>
      <span class="small-head" data-he="מה חדש" data-en="What's new">מה חדש</span>
      <ul id="changeList"></ul>
    </div>
    <div class="row">
      <button id="updateNow" class="primary" type="button" data-he="עדכן עכשיו" data-en="Update now">עדכן עכשיו</button>
      <button id="updateLater" type="button" data-he="אחר כך" data-en="Later">אחר כך</button>
    </div>
  </div>
  <h1><img src="icon.svg" width="34" height="34" alt="" /> KesherAI</h1>
  <p data-he="התחבר ל-KesherAI שרץ במחשב שלך. כל העבודה רצה במחשב; הטלפון רק שולח ומציג." data-en="Connect to KesherAI running on your computer. All the work runs there; the phone only sends and shows.">התחבר ל-KesherAI שרץ במחשב שלך. כל העבודה רצה במחשב; הטלפון רק שולח ומציג.</p>
  <div id="computers" class="computers" hidden>
    <strong data-he="המחשבים שלך" data-en="Your computers">המחשבים שלך</strong>
    <div id="computerList" class="computers"></div>
  </div>
  <ol>
    <li data-he="במחשב: הגדרות ← טלפון. העתק את קישור החיבור." data-en="On the computer: Settings → Phone. Copy the connection link.">במחשב: הגדרות ← טלפון. העתק את קישור החיבור.</li>
    <li data-he="הדבק אותו כאן. הוא נשמר, ובפעם הבאה האפליקציה תתחבר מעצמה." data-en="Paste it here. It is saved, and next time the app connects by itself.">הדבק אותו כאן. הוא נשמר, ובפעם הבאה האפליקציה תתחבר מעצמה.</li>
  </ol>
  <form id="form">
    <label><span data-he="קישור החיבור" data-en="Connection link">קישור החיבור</span>
      <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="http://100.x.x.x:7420/?token=…" required />
    </label>
  </form>
  <button class="primary" type="submit" form="form" data-he="התחבר" data-en="Connect">התחבר</button>
  <button id="scan" type="button" data-he="סרוק קוד QR" data-en="Scan QR code">סרוק קוד QR</button>
  <button id="local" type="button" class="local" data-he="בלי מחשב: מודל על הטלפון" data-en="No computer: a model on this phone">בלי מחשב: מודל על הטלפון</button>
  <p id="status"></p>
  <button id="checkUpdate" type="button" data-he="בדוק עדכונים לאפליקציה" data-en="Check for app updates">בדוק עדכונים לאפליקציה</button>
  <button id="lang" type="button">English</button>
  <p id="version" class="small" dir="ltr"></p>
</main>
<script>
  // The whole app: remember the link, check it answers, then open the
  // KesherAI interface the computer serves. "Change server" is reached by
  // opening the app while it is trying to connect (tap Cancel).
  const KEY = "kesherai-server";
  const $ = (id) => document.getElementById(id);
  let lang = localStorage.getItem("lang") || (navigator.language.startsWith("he") ? "he" : "en");
  const tr = { checking: { he: "מתחבר…", en: "Connecting…" }, cancel: { he: "ביטול", en: "Cancel" },
    fail: { he: "אין תשובה מהמחשב. בדוק שהוא דלוק, ש-KesherAI פתוח, ושהטלפון באותה רשת או ב-Tailscale. בפעם הראשונה ב-Windows: הפעל במחשב את scripts\\windows\\allow-phone.cmd מתיקיית KesherAI (פותח את חומת האש).", en: "No answer from the computer. Check that it is on, KesherAI is open, and the phone is on the same network or on Tailscale. First time on Windows: on the computer, run scripts\\windows\\allow-phone.cmd from the KesherAI folder (it opens the firewall)." },
    bad: { he: "הקישור לא תקין. העתק אותו שוב מהגדרות ← טלפון.", en: "That link is not valid. Copy it again from Settings → Phone." },
    wake: { he: "הער את המחשב", en: "Wake the computer" },
    lastUsed: { he: "שימוש אחרון: ", en: "Last used: " },
    removeComputer: { he: "להסיר את המחשב הזה מהרשימה?", en: "Remove this computer from the list?" },
    tryingNext: { he: "מנסה כתובת אחרת…", en: "Trying another address…" },
    installingScanner: { he: "מכין את הסורק (פעם ראשונה בלבד)…", en: "Preparing the scanner (first time only)…" },
    notKesher: { he: "זה לא קוד של KesherAI. סרוק את הקוד שבמחשב: הגדרות ← טלפון.", en: "That is not a KesherAI code. Scan the code on the computer: Settings → Phone." },
    scanFailed: { he: "הסריקה לא הצליחה: ", en: "Scanning did not work: " },
    newVersion: { he: "גרסה חדשה של האפליקציה זמינה: ", en: "A new version of the app is available: " },
    upToDate: { he: "האפליקציה מעודכנת.", en: "The app is up to date." },
    checkingUpdate: { he: "בודק עדכונים…", en: "Checking for updates…" },
    downloading: { he: "מוריד את העדכון… ", en: "Downloading the update… " },
    allowInstall: { he: "אפשר ל-KesherAI להתקין עדכונים במסך שנפתח, חזור ולחץ שוב על עדכן.", en: "Allow KesherAI to install updates on the screen that opened, then come back and tap Update again." },
    updateFailed: { he: "העדכון נכשל: ", en: "The update failed: " },
    waking: { he: "שולח בקשת הערה ומחכה למחשב (עד דקה)…", en: "Sent a wake-up and waiting for the computer (up to a minute)…" },
    noWake: { he: "המחשב לא התעורר. בדוק ש-Wake-on-LAN מופעל, שהמחשב מחובר בכבל רשת, ושהטלפון באותה רשת ביתית.", en: "The computer did not wake. Check that Wake-on-LAN is on, the computer is on a network cable, and the phone is on the same home network." } };
  function applyLang() {
    document.documentElement.lang = lang; document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
    document.querySelectorAll("[data-he]").forEach((el) => (el.textContent = el.dataset[lang]));
    $("lang").textContent = lang === "he" ? "English" : "עברית";
  }
  $("local").onclick = () => { cancelled = true; location.href = "local.html"; };
  $("lang").onclick = () => { lang = lang === "he" ? "en" : "he"; localStorage.setItem("lang", lang); applyLang(); };
  applyLang();

  let cancelled = false;

  /** Sends a Wake-on-LAN packet through the native plugin, then waits for the computer. */
  async function wake(url) {
    const mac = url.searchParams.get("wake");
    const broadcast = url.searchParams.get("bcast") || undefined;
    const plugin = window.Capacitor?.Plugins?.WakeOnLan;
    if (!mac || !plugin) return;
    $("status").className = "";
    $("status").textContent = tr.waking[lang];
    try { await plugin.wake({ mac, broadcast }); } catch (e) { $("status").textContent = String(e?.message || e); return; }
    const token = url.searchParams.get("token");
    for (let i = 0; i < 20 && !cancelled; i++) {
      await new Promise((r) => setTimeout(r, 3000));
      const ok = await fetch(`${url.origin}/api/health`, { headers: token ? { authorization: `Bearer ${token}` } : {}, signal: AbortSignal.timeout(2500) }).then((r) => r.ok).catch(() => false);
      if (ok) { connect(url.href); return; }
      if (i % 3 === 2) await plugin.wake({ mac, broadcast }).catch(() => undefined);
    }
    if (!cancelled) { $("status").textContent = tr.noWake[lang]; $("status").className = "error"; }
  }

  // ---------- Saved computers ----------
  // Each computer is saved with its token and every address it was seen at
  // (home network, Tailscale, the "anywhere" link), so it reconnects without
  // scanning again, even after the network or the tunnel address changes.
  const COMPUTERS = "kesherai-computers";
  const loadComputers = () => { try { return JSON.parse(localStorage.getItem(COMPUTERS) || "[]"); } catch { return []; } };
  const saveComputers = (list) => localStorage.setItem(COMPUTERS, JSON.stringify(list));

  /** Remembers a computer after a successful connection, and learns its other addresses. */
  async function rememberComputer(url, token) {
    const list = loadComputers();
    let c = list.find((x) => x.token === token);
    if (!c) { c = { token, name: url.hostname, links: [] }; list.push(c); }
    const base = url.origin;
    c.links = [base, ...c.links.filter((l) => l !== base)];
    c.wake = url.searchParams.get("wake") || c.wake;
    c.bcast = url.searchParams.get("bcast") || c.bcast;
    c.lastUsed = new Date().toISOString();
    try {
      const info = await fetch(`${base}/api/remote/links`, { headers: { authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(4000) }).then((r) => r.json());
      if (info?.name) c.name = info.name;
      for (const l of info?.links ?? []) {
        if (!c.links.includes(l.url)) c.links.push(l.url);
        if (l.kind === "home" && l.mac && !c.wake) { c.wake = l.mac; c.bcast = l.broadcast; }
      }
    } catch { /* older KesherAI: keep what we have */ }
    saveComputers(list);
  }

  function linkFor(c, base) {
    const u = new URL(base);
    u.pathname = "/";
    u.search = `?token=${encodeURIComponent(c.token)}${c.wake ? `&wake=${c.wake}&bcast=${c.bcast || ""}` : ""}`;
    return u.href;
  }

  /** Tries each saved address of a computer, the last one that worked first. */
  async function connectComputer(c) {
    cancelled = false;
    for (let i = 0; i < c.links.length && !cancelled; i++) {
      if (i > 0) { $("status").className = ""; $("status").textContent = tr.tryingNext[lang]; }
      const ok = await fetch(`${c.links[i]}/api/health`, { headers: { authorization: `Bearer ${c.token}` }, signal: AbortSignal.timeout(5000) }).then((r) => r.ok).catch(() => false);
      if (ok) return connect(linkFor(c, c.links[i]));
    }
    if (!cancelled) connect(linkFor(c, c.links[0])); // shows the error and the wake button
  }

  function renderComputers() {
    const list = loadComputers().sort((a, b) => (b.lastUsed || "").localeCompare(a.lastUsed || ""));
    $("computers").hidden = list.length === 0;
    const box = $("computerList");
    box.textContent = "";
    for (const c of list) {
      const row = document.createElement("div");
      row.className = "computer";
      const go = document.createElement("button");
      go.type = "button";
      go.className = "go";
      const name = document.createElement("strong");
      name.textContent = c.name;
      const small = document.createElement("small");
      small.textContent = (c.lastUsed ? tr.lastUsed[lang] + new Date(c.lastUsed).toLocaleString() : "") + " · " + c.links.length + " addresses";
      go.append(name, small);
      go.onclick = () => connectComputer(c);
      const del = document.createElement("button");
      del.type = "button";
      del.className = "del";
      del.textContent = "✕";
      del.setAttribute("aria-label", "Remove");
      del.onclick = () => { if (confirm(tr.removeComputer[lang])) { saveComputers(loadComputers().filter((x) => x.token !== c.token)); renderComputers(); } };
      row.append(go, del);
      box.append(row);
    }
  }
  renderComputers();

  async function connect(link) {
    let url;
    try { url = new URL(link.trim()); } catch { $("status").textContent = tr.bad[lang]; $("status").className = "error"; return; }
    if (!/^https?:$/.test(url.protocol)) { $("status").textContent = tr.bad[lang]; return; }
    cancelled = false;
    $("status").className = "";
    $("status").innerHTML = `${tr.checking[lang]} <button type="button" id="cancel">${tr.cancel[lang]}</button>`;
    $("cancel").onclick = () => { cancelled = true; $("status").textContent = ""; };
    const token = url.searchParams.get("token");
    try {
      const res = await fetch(`${url.origin}/api/health`, { headers: token ? { authorization: `Bearer ${token}` } : {}, signal: AbortSignal.timeout(8000) });
      if (!res.ok) throw new Error(String(res.status));
      if (cancelled) return;
      localStorage.setItem(KEY, url.href);
      if (token) await rememberComputer(url, token);
      // Coming back here with the Back button shows this screen instead of connecting again.
      sessionStorage.setItem("kesherai-connected", "1");
      const open = new URL(url.href);
      open.searchParams.set("app", location.origin + "/");
      location.href = open.href; // the interface stores the token and removes it from the address
    } catch {
      if (cancelled) return;
      $("status").textContent = tr.fail[lang];
      $("status").className = "error";
      // The computer may be asleep: offer to wake it when the link carries its network card's address.
      if (url.searchParams.get("wake") && window.Capacitor?.Plugins?.WakeOnLan) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "primary";
        b.textContent = tr.wake[lang];
        b.onclick = () => wake(url);
        $("status").append(document.createElement("br"), b);
      }
    }
  }
  $("form").onsubmit = (e) => { e.preventDefault(); connect($("url").value); };

  /**
   * The QR code in KesherAI → Settings → Phone is a `kesherai://connect?server=<link>` link:
   * scanning it with the phone camera opens this app and connects straight away.
   */
  function fromDeepLink(link) {
    try {
      const u = new URL(link);
      if (u.protocol !== "kesherai:") return null;
      const server = u.searchParams.get("server");
      return server && /^https?:\/\//.test(server) ? server : null;
    } catch { return null; }
  }
  const App = window.Capacitor?.Plugins?.App;
  App?.addListener("appUrlOpen", (e) => {
    const server = fromDeepLink(e.url);
    if (server) { $("url").value = server; connect(server); }
  });
  // ---------- Scan the QR code from Settings → Phone on the computer ----------
  const Scanner = window.Capacitor?.Plugins?.BarcodeScanner;
  if (!Scanner) $("scan").hidden = true;
  $("scan").onclick = async () => {
    cancelled = true;
    $("status").className = "";
    $("status").textContent = "";
    try {
      // Google's scanner needs no camera permission; it is downloaded by Play services the first time.
      const { available } = await Scanner.isGoogleBarcodeScannerModuleAvailable();
      if (!available) {
        $("status").textContent = tr.installingScanner[lang];
        await new Promise((resolve) => {
          Scanner.addListener("googleBarcodeScannerModuleInstallProgress", (e) => { if (e.state === 4 || e.state === 5) resolve(); });
          Scanner.installGoogleBarcodeScannerModule().catch(resolve);
          setTimeout(resolve, 30000);
        });
        $("status").textContent = "";
      }
      const { barcodes } = await Scanner.scan({ formats: ["QR_CODE"] });
      const value = barcodes?.[0]?.rawValue ?? "";
      if (!value) return;
      const server = fromDeepLink(value) || (/^https?:\/\/.+token=/.test(value) ? value : null);
      if (!server) { $("status").textContent = tr.notKesher[lang]; $("status").className = "error"; return; }
      $("url").value = server;
      connect(server);
    } catch (e) {
      const msg = e?.message || String(e);
      if (!/cancel/i.test(msg)) { $("status").textContent = tr.scanFailed[lang] + msg; $("status").className = "error"; }
    }
  };

  // ---------- App updates (published by .github/workflows/android.yml) ----------
  const Updater = window.Capacitor?.Plugins?.KesherUpdater;
  const VERSION_URL = "https://github.com/Deadchu-R/KesherAI/releases/download/android-latest/android-version.json";
  let latest = null;
  if (!Updater) $("checkUpdate").hidden = true;

  /** Lists the changes between the installed build and the new one (newest first). */
  async function showChanges(changes) {
    if (!Array.isArray(changes) || changes.length === 0) return;
    const mine = await fetch("build.json").then((r) => r.json()).then((b) => b.commit).catch(() => "");
    const list = [];
    for (const c of changes) {
      if (mine && c.sha === mine) break;
      if (!/^Merge /.test(c.subject)) list.push(c.subject);
    }
    const ul = $("changeList");
    ul.replaceChildren(...list.slice(0, 20).map((text) => Object.assign(document.createElement("li"), { textContent: text, dir: "auto" })));
    if (list.length > 20) ul.append(Object.assign(document.createElement("li"), { textContent: `+${list.length - 20}`, className: "more" }));
    $("changes").hidden = list.length === 0;
  }

  /** @returns Whether a newer version is available. */
  async function checkForUpdate(quiet) {
    if (!Updater) return false;
    if (!quiet) { $("status").className = ""; $("status").textContent = tr.checkingUpdate[lang]; }
    try {
      latest = await Updater.check({ url: VERSION_URL });
      $("version").textContent = `v${latest.currentName}`;
      if (latest.available) {
        $("updateText").textContent = tr.newVersion[lang] + latest.latestName;
        showChanges(latest.changes);
        $("update").hidden = false;
        if (!quiet) $("status").textContent = "";
        return true;
      }
      if (!quiet) $("status").textContent = tr.upToDate[lang];
    } catch (e) {
      if (!quiet) { $("status").textContent = tr.updateFailed[lang] + (e?.message || e); $("status").className = "error"; }
    }
    return false;
  }
  $("checkUpdate").onclick = () => { cancelled = true; checkForUpdate(false); };
  $("updateLater").onclick = () => { $("update").hidden = true; const saved = localStorage.getItem(KEY); if (saved) connect(saved); };
  $("updateNow").onclick = async () => {
    if (!latest?.apkUrl) return;
    $("status").className = "";
    $("status").textContent = tr.downloading[lang];
    const sub = await Updater.addListener("progress", (p) => { if (p.percent >= 0) $("status").textContent = tr.downloading[lang] + p.percent + "%"; });
    try {
      await Updater.install({ url: latest.apkUrl });
      $("status").textContent = "";
    } catch (e) {
      const msg = e?.message || String(e);
      $("status").textContent = msg === "needs-permission" ? tr.allowInstall[lang] : tr.updateFailed[lang] + msg;
    } finally {
      sub?.remove?.();
    }
  };

  (async () => {
    const launch = fromDeepLink((await App?.getLaunchUrl?.().catch(() => null))?.url ?? "");
    // "Check for app updates" in the interface's menu comes back here with ?update=1.
    if (new URLSearchParams(location.search).has("update")) { await checkForUpdate(false); return; }
    // A newer app waits for the user's choice before connecting; a scanned code connects anyway.
    if ((await checkForUpdate(true)) && !launch) return;
    const saved = launch || localStorage.getItem(KEY);
    if (saved) $("url").value = saved;
    // "Switch computer" in the interface comes back here with ?switch=1: show the list, do not reconnect.
    const cameBack = sessionStorage.getItem("kesherai-connected") === "1" || new URLSearchParams(location.search).has("switch");
    const recent = loadComputers().sort((a, b) => (b.lastUsed || "").localeCompare(a.lastUsed || ""))[0];
    if (launch) connect(launch);
    else if (!cameBack && recent) connectComputer(recent);
    else if (!cameBack && saved) connect(saved);
  })();
</script>
</body>
</html>
