<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121213" />
  <link rel="stylesheet" href="theme.css" />
  <script src="vendor/path.js"></script>
  <title>KesherAI · Kesher Cloud</title>
  <style>
    /* The ☁ Cloud tab of the top bar (Phone / Computer / ☁ Cloud). It opens the owner's Kesher Cloud hub page, which
       shows the hub's own tabs (dashboard, devices, tasks, pair, settings) under the same switch; without a hub it
       explains how to connect one. */
    .wbar { position: sticky; top: 0; display: flex; align-items: center; gap: 8px; padding: max(8px, env(safe-area-inset-top)) 12px 8px; background: var(--bg); border-bottom: 1px solid var(--border); }
    .seg { display: flex; background: var(--panel); border: 1px solid #2a2a2e; border-radius: 10px; padding: 2px; gap: 2px; }
    .seg a { display: grid; place-items: center; min-height: 32px; padding: 0 10px; border-radius: 8px; color: var(--muted); font-size: 12.5px; text-decoration: none; }
    .seg a.on { background: #2e2e3a; color: var(--text); font-weight: 500; }
    main { max-width: 560px; margin: 0 auto; padding: 28px 18px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
    .logo { width: 76px; height: 76px; margin: 0 auto; border-radius: 22px; background: #262a3d; display: grid; place-items: center; font-size: 36px; }
    h1 { margin: 0; text-align: center; font-size: 22px; }
    p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 14.5px; }
    .card { border: 1px solid var(--border); background: var(--panel); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
    input { direction: ltr; width: 100%; }
    .error { color: var(--bad); }
    .small { font-size: 13px; text-align: center; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<nav class="wbar">
  <div class="seg" role="tablist" aria-label="Where it runs">
    <a role="tab" href="local.html" data-he="טלפון" data-en="Phone">טלפון</a>
    <a role="tab" href="index.html" data-he="מחשב" data-en="Computer">מחשב</a>
    <a role="tab" class="on" aria-selected="true" data-he="☁ ענן" data-en="☁ Cloud">☁ ענן</a>
  </div>
</nav>
<main>
  <div class="logo" aria-hidden="true">☁</div>
  <h1>Kesher Cloud</h1>
  <p id="opening" hidden data-he="פותח את המרכז שלך…" data-en="Opening your hub…">פותח את המרכז שלך…</p>
  <p id="path" class="small" hidden></p>
  <p id="tsHint" class="small" hidden></p>
  <section id="empty" class="card" hidden>
    <strong data-he="לחבר מרכז" data-en="Connect a hub">לחבר מרכז</strong>
    <p data-he="המרכז הפרטי שלך (Cloudflare, בחינם) מראה אילו מחשבים דלוקים ושולח משימות נעולות גם כשהמחשב כבוי. את הכתובת מוצאים במחשב: הגדרות › טלפון וגישה מרחוק › ענן Kesher." data-en="Your own private hub (Cloudflare, free) shows which PCs are on and sends sealed tasks even when the PC is off. Find its address on the PC: Settings › Phone and remote access › Kesher Cloud.">המרכז הפרטי שלך (Cloudflare, בחינם) מראה אילו מחשבים דלוקים ושולח משימות נעולות גם כשהמחשב כבוי. את הכתובת מוצאים במחשב: הגדרות › טלפון וגישה מרחוק › ענן Kesher.</p>
    <form id="form">
      <label><span data-he="כתובת המרכז" data-en="Hub address">כתובת המרכז</span><input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://hub.example.com" required /></label>
    </form>
    <button id="save" class="primary" type="button" data-he="פתח את המרכז" data-en="Open the hub">פתח את המרכז</button>
    <p id="status" class="small"></p>
  </section>
  <button id="change" type="button" hidden data-he="שנה את כתובת המרכז" data-en="Change the hub address">שנה את כתובת המרכז</button>
  <p class="small" data-he="ההיסטוריה של משימות הענן נשמרת בטלפון. המרכז רק מעביר." data-en="The history of cloud tasks is kept on the phone. The hub only relays.">ההיסטוריה של משימות הענן נשמרת בטלפון. המרכז רק מעביר.</p>
</main>
<script>
  // The hub address is remembered here (the app's own storage), so the Cloud tab works when the PC is off.
  const KEY = "kesherai-hub";
  const $ = (id) => document.getElementById(id);
  const lang = (localStorage.getItem("lang") || (navigator.language.startsWith("he") ? "he" : "en")) === "en" ? "en" : "he";
  if (lang === "en") { document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; }
  for (const el of document.querySelectorAll("[data-he]")) el.textContent = el.dataset[lang];

  /** A hub address that is safe to open: https (or http on this device for testing), no credentials, no query. */
  function clean(u) {
    try {
      const x = new URL(String(u).trim());
      const local = x.hostname === "localhost" || x.hostname === "127.0.0.1";
      if (x.protocol !== "https:" && !(x.protocol === "http:" && local)) return "";
      if (x.username || x.password) return "";
      return x.origin + x.pathname.replace(/\/+$/, "");
    } catch { return ""; }
  }
  /**
   * A Google access token for the hub page's tasks list (Drive's hidden app folder), from the app's own Google sign-in,
   * so the page needs no hourly "Reconnect Drive" tap. Only when that sign-in granted `drive.appdata` (signed in before
   * it was asked: sign out and in again once). Never stored by the page; it goes in the address fragment, which is not
   * sent to any server. Least privilege: a fresh token asked for the app-folder scope alone (not the app's own token,
   * which also opens Drive files and the profile); kept apart from the app's stored token.
   */
  async function driveToken() {
    const APPDATA = "https://www.googleapis.com/auth/drive.appdata";
    const Google = window.Capacitor?.Plugins?.KesherGoogle;
    let g = null;
    try { g = JSON.parse(localStorage.getItem("kesherai-google") || "null"); } catch { /* none */ }
    if (!Google || !g?.refreshToken || !String(g.scope || "").split(" ").includes(APPDATA)) return null;
    const c = await fetch("google-client.json").then((r) => (r.ok ? r.json() : null)).catch(() => null);
    if (!c?.clientId) return null;
    const r = await Google.refresh({ clientId: c.clientId, clientSecret: c.clientSecret, refreshToken: g.refreshToken, scope: APPDATA });
    return r?.accessToken ? { token: r.accessToken, secs: r.expiresIn } : null;
  }
  /** Opens the hub page, which shows the Phone / Computer / ☁ Cloud switch when it knows it runs in the app. */
  const open = async (hub) => {
    const t = await Promise.race([driveToken().catch(() => null), new Promise((r) => setTimeout(() => r(null), 8000))]);
    const frag = t ? `#kdt=${encodeURIComponent(t.token)}&kde=${Math.max(60, Math.min(3600, Math.floor(t.secs)))}` : "";
    location.replace(`${hub}/?app=${encodeURIComponent(location.origin)}${frag}`);
  };

  /**
   * The hub first; when it does not answer, answers 5xx or has used up its daily storage, straight to the computer
   * through Tailscale (direct-path.ts), with the same key this phone uses at home. Without a Tailscale address for
   * the computer, a one-time hint to install Tailscale, then the hub page anyway: its service worker opens the copy
   * kept on this phone, which sends through the backup relays (packages/shared/src/hub-offline.ts).
   */
  async function hubOrDirect(hub) {
    const P = globalThis.kesherPath;
    if (!P) return open(hub);
    // The hub sends no CORS headers to the app, so this only tells whether it answered at all (an opaque answer);
    // a 5xx or the storage limit is caught by the hub page itself, which offers the same direct path.
    const probe = await fetch(`${hub}/api/config`, { mode: "no-cors", cache: "no-store", signal: AbortSignal.timeout(8000) })
      .then(() => ({ status: 200 }))
      .catch(() => ({}));
    let computers = [];
    try { computers = JSON.parse(localStorage.getItem("kesherai-computers") || "[]"); } catch { /* none */ }
    const recent = computers.sort((a, b) => (b.lastUsed || "").localeCompare(a.lastUsed || ""))[0];
    const ip = (recent?.links || []).map((l) => { try { return new URL(l).hostname; } catch { return ""; } }).find((h) => /^100\./.test(h));
    const direct = P.cleanTailscaleDirect({ ...(recent?.tailscale || {}), ...(ip && !recent?.tailscale?.ip ? { ip } : {}) });
    const pick = P.choosePath(probe, direct);
    const show = (path) => { $("path").hidden = false; $("path").textContent = P.PATH_LABELS[path][lang]; };
    // The probe can fail while the hub works (2026-11-23: the Cloud tab jumped to the Computer tab's connect screen
    // every time, though hub.roeetal.com answered). So the Cloud tab always opens the hub page: it serves its saved
    // copy when Cloudflare is down, sends through the backup relays and offers the direct Tailscale path itself.
    // The automatic jump to Tailscale stays only behind ?direct-first (for testing).
    if (pick.path === "tailscale" && params.has("direct-first")) {
      $("opening").hidden = true;
      show("tailscale");
      return location.replace("index.html?direct=1");
    }
    if (!P.hubUsable(probe) && !localStorage.getItem("kesherai-ts-hint")) {
      localStorage.setItem("kesherai-ts-hint", "1");
      $("tsHint").hidden = false;
      $("tsHint").textContent = P.TAILSCALE_HINT[lang];
      await new Promise((r) => setTimeout(r, 4000));
    }
    if (P.hubUsable(probe)) show("hub");
    else {
      // The hub page's service worker serves the copy kept on this phone (the last devices, the relays' sealed keys),
      // so it still sends through Ably or Supabase while Cloudflare is down.
      $("path").hidden = false;
      $("path").textContent = lang === "en" ? "The hub is not answering: opening the copy kept on this phone" : "המרכז לא עונה: פותח את העותק השמור בטלפון";
    }
    return open(hub);
  }
  const params = new URLSearchParams(location.search);
  const given = clean(params.get("hub") || "");
  if (given) localStorage.setItem(KEY, given);
  const hub = clean(localStorage.getItem(KEY) || "");
  if (hub && !params.has("change")) {
    $("opening").hidden = false;
    $("change").hidden = false;
    void hubOrDirect(hub);
  } else {
    $("empty").hidden = false;
    $("url").value = hub;
  }
  $("change").onclick = () => location.replace("cloud.html?change=1");
  const save = () => {
    const h = clean($("url").value);
    if (!h) { $("status").textContent = lang === "he" ? "הכתובת צריכה להתחיל ב-https://" : "The address must start with https://"; $("status").className = "small error"; return; }
    localStorage.setItem(KEY, h);
    void open(h);
  };
  $("save").onclick = save;
  $("form").onsubmit = (e) => { e.preventDefault(); save(); };
</script>
</body>
</html>
