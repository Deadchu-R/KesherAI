buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Kotlin, for Google's LiteRT-LM API (Gemma 4 and other .litertlm models).
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.0"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = "dev.kesherai.llm"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    // Google's on-device LLM runtime (LiteRT / MediaPipe): GPU (Adreno, Mali) and CPU kernels tuned for phones.
    implementation "com.google.mediapipe:tasks-genai:0.10.24"
    // Google's newer runtime for .litertlm models (Gemma 4): GPU through OpenCL, CPU fallback.
    implementation "com.google.ai.edge.litertlm:litertlm-android:0.19.1"
    implementation "androidx.core:core:${project.hasProperty('androidxCoreVersion') ? rootProject.ext.androidxCoreVersion : '1.15.0'}"
}
